        "404":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
        "422":
          description: >-
            CERTIFICADO_SENHA_OU_ARQUIVO_INVALIDO, CERTIFICADO_SEM_CHAVE_PRIVADA, CERTIFICADO_VENCIDO, CERTIFICADO_AINDA_NAO_VALIDO,
