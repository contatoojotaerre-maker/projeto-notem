        schema:
          type: string
          format: uuid
    post:
      tags:
        - Notas
      operationId: substituirNota
      x-titulo: Substituir nota
      summary: "Emite uma nova nota que corrige e substitui uma nota autorizada."
      description: |-
        Use para corrigir uma nota autorizada sem cancelá-la antes. Envie o motivo, a justificativa e só os campos que mudam; os demais são copiados da nota original. A empresa é sempre a mesma da original.

        Antes de gerar o número da nova nota, a notem faz as mesmas conferências da emissão e aplica as regras do governo sobre o que pode mudar. Empresa fora do Simples Nacional não pode mudar competência, código do serviço, código municipal nem local da prestação (E0060). Empresa MEI ou ME/EPP não pode mudar o documento do tomador, a competência nem o valor do serviço (E0061).

        As respostas são iguais às de [Emitir nota](https://docs.notemfiscal.com.br/referencia/notas/emitir-nota) e se referem à nova nota. A original só passa a `substituida` quando a nova é autorizada. Se a nova for recusada, a original continua valendo.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoSubstituicao"
            examples:
