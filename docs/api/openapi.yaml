    post:
      tags:
        - Certificado
      operationId: enviarCertificado
      x-titulo: Enviar certificado
      summary: "Envia ou troca o certificado digital A1 que a empresa usa para assinar as notas."
      description: |-
        O certificado é necessário para emitir e cancelar notas. Envie o arquivo .pfx ou .p12 (até 100 KB) em base64, com a senha. O CNPJ do certificado precisa ser o da empresa.

        O certificado anterior continua valendo até o novo ser aceito, então uma troca recusada não interrompe as emissões. Quando o arquivo é recusado, a resposta 422 diz o motivo: senha errada, certificado vencido, sem chave privada ou de outro CNPJ.

