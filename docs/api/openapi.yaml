    ConfiguracaoFiscal:
      description: |
        Matriz obrigatória: nao_optante aceita somente percentual_por_esfera (E0713);
        mei aceita percentual_por_esfera ou nao_informar, nunca percentual_simples (E0710);
        me_epp aceita percentual_simples ou percentual_por_esfera, nunca nao_informar (E0712).
        Por esfera exige federal/estadual/municipal; zero é permitido. Ausentes são null.
        Legados incompatíveis não são reescritos, ficam com configuração fiscal incompleta
        e bloqueiam emissão antes de numerar com mensagem da regra.
        Regime especial deve ser nenhum para MEI (E0174), ME/EPP dentro do Simples (E0175)
        e serviços ativos com imunidade/exportação/não incidência (E0172).
      type: object
      required:
        - simples_nacional
        - regime_especial
        - tributos_aproximados
      properties:
        simples_nacional:
          type: string
          enum:
            - nao_optante
            - mei
            - me_epp
        regime_apuracao_simples:
          type:
            - string
            - "null"
          enum:
            - dentro_do_simples
            - iss_fora_do_simples
            - tudo_fora_do_simples
            - null
        regime_especial:
          type: string
          enum:
            - nenhum
            - ato_cooperado
            - estimativa
            - microempresa_municipal
            - notario_registrador
            - profissional_autonomo
            - sociedade_profissionais
            - outros
        tributos_aproximados:
          type: object
          required:
            - modo
          properties:
            modo:
              type: string
              enum:
                - percentual_simples
                - percentual_por_esfera
                - nao_informar
            percentual_simples:
              oneOf:
                - $ref: "#/components/schemas/Percentual"
                - type: "null"
            federal:
              oneOf:
                - $ref: "#/components/schemas/Percentual"
                - type: "null"
            estadual:
              oneOf:
                - $ref: "#/components/schemas/Percentual"
                - type: "null"
            municipal:
              oneOf:
                - $ref: "#/components/schemas/Percentual"
                - type: "null"
        aliquota_iss_simples:
          oneOf:
            - $ref: "#/components/schemas/Percentual"
            - type: "null"
        regime_apuracao_ibscbs:
          type:
            - string
            - "null"
          enum:
            - pelo_simples
            - cbs_simples_ibs_regular
            - regime_regular
            - null
          description: >-
            Somente ME/EPP (regApIBSCBSSN). Com ISS dentro do Simples: pelo_simples (padrão) ou regime_regular. Com ISS fora do Simples: cbs_simples_ibs_regular
            (padrão) ou regime_regular. Ausente ou null usa o padrão; ao mudar regime_apuracao_simples o padrão é reaplicado. Guardado agora e enviado a partir
            do próximo leiaute da NT 009.
        imprimir_canhoto_danfse:
          type: boolean
          default: false
          description: Ausente no PUT preserva valor atual
        serie_dps:
          type:
            - string
            - "null"
          readOnly: true
          examples:
            - "00900"
