openapi: 3.1.0
info:
  title: API da notem
  version: "1.0.0"
  description: |
    API para emissão e gestão de NFS-e (padrão nacional) por sistemas parceiros.
    Leia primeiro docs/api/convencoes.md. Campos em português; valores monetários como texto ("150.00").
servers:
  - url: https://app.notemfiscal.com.br/api/v1
    description: API oficial da notem
security:
  - chaveIntegracao: []
tags:
  - name: Geral
    description: Verificação da chave e do ambiente
paths:
  /status:
    get:
      tags: [Geral]
      summary: Verifica a chave e informa o ambiente
      description: |
        Use para testar a integração. Não consome nada e não acessa o governo.
        O ambiente, a organização e a integração são determinados exclusivamente pela chave.
      responses:
        "200":
          description: Chave válida
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [ambiente, organizacao, integracao]
                properties:
                  ambiente: { $ref: "#/components/schemas/Ambiente" }
                  organizacao:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      nome: { type: string }
                  integracao:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      nome: { type: string }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
components:
  securitySchemes:
    chaveIntegracao:
      type: http
      scheme: bearer
      description: "Chave da integração: ntm_homolog_... (homologação) ou ntm_prod_... (produção)."
  headers:
    XRequestId:
      description: Identificador da requisição (informe ao suporte)
      schema: { type: string }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Chave de idempotência gerada pelo parceiro (até 100 caracteres). Obrigatória em emissão, cancelamento e substituição.
      schema: { type: string, maxLength: 100 }
    Limite:
      name: limite
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  schemas:
    Ambiente:
      type: string
      enum: [homologacao, producao]
    Valor:
      type: string
      pattern: '^\d+\.\d{2}$'
      description: Valor em reais, ponto decimal, 2 casas
      examples: ["150.00"]
    Percentual:
      type: string
      pattern: '^\d{1,3}(\.\d{1,2})?$'
      examples: ["2.00"]
    Cnpj:
      type: string
      pattern: '^\d{14}$'
    CodigoMunicipio:
      type: string
      pattern: '^\d{7}$'
    Erro:
      type: object
      required: [erro, id_requisicao]
      properties:
        erro:
          type: object
          required: [codigo, mensagem, detalhes, codigo_governo, mensagem_governo]
          properties:
            codigo: { type: string, examples: ["REQUISICAO_INVALIDA"] }
            mensagem: { type: string }
            detalhes:
              type: array
              items:
                type: object
                properties:
                  campo: { type: string }
                  mensagem: { type: string }
            codigo_governo: { type: [string, "null"] }
            mensagem_governo: { type: [string, "null"] }
        id_requisicao: { type: string }
    ListaPaginada:
      type: object
      required: [dados, proximo_cursor]
      properties:
        dados: { type: array, items: {} }
        proximo_cursor: { type: [string, "null"] }
  responses:
    AutenticacaoInvalida:
      description: Chave ausente, inválida ou revogada
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }

# Webhooks são callbacks de saída; não são novos endpoints da API v1.
webhooks:
  eventoNotem:
    post:
      summary: Evento assinado da notem (inclui webhook.teste)
      description: |
        Contrato completo em webhooks.md. URL cadastrada no painel por ambiente.
        Corpo bruto preservado em todas as tentativas, sem garantia de ordem.
        HMAC SHA-256 de "{timestamp}.{corpoBruto}"; tolerância do receptor de 5 minutos.
        Oito tentativas: inicial, depois 1 min, 5 min, 30 min, 2 h, 6 h, 12 h e 24 h.
        Segredo anterior aceito por 24 h durante troca; múltiplos v1 no mesmo cabeçalho.
        Retenção 90 dias; três dias contínuos sem sucesso desativam o endereço e geram alerta.
      security: []
      parameters:
        - in: header
          name: Notem-Evento
          required: true
          schema: { type: string }
        - in: header
          name: Notem-Evento-Id
          required: true
          schema: { type: string, pattern: '^evt_[a-f0-9]{32}$' }
        - in: header
          name: Notem-Entrega-Id
          required: true
          schema: { type: string, pattern: '^whd_[a-f0-9]{32}$' }
        - in: header
          name: Notem-Assinatura
          required: true
          schema: { type: string }
          description: 't=timestamp,v1=HMAC; pode incluir duas assinaturas v1 na troca de segredo.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, tipo, criado_em, ambiente, organizacao_id, integracao_id, dados]
              properties:
                id: { type: string, pattern: '^evt_[a-f0-9]{32}$' }
                tipo:
                  type: string
                  enum: [webhook.teste, nota.autorizada, nota.rejeitada, nota.cancelada, nota.cancelamento_em_analise, nota.cancelamento_indeferido, nota.substituida, nota.cancelada_prefeitura, nota.bloqueada_prefeitura, nota.manifestacao, empresa.situacao_alterada, certificado.vencendo, certificado.vencido, municipio.disponivel]
                criado_em: { type: string, format: date-time }
                ambiente: { type: string, enum: [homologacao, producao] }
                organizacao_id: { type: string, format: uuid }
                integracao_id: { type: string, format: uuid }
                dados: { type: object }
            example:
              id: evt_00000000000000000000000000000000
              tipo: webhook.teste
              criado_em: '2026-11-05T00:00:00Z'
              ambiente: homologacao
              organizacao_id: '00000000-0000-0000-0000-000000000001'
              integracao_id: '00000000-0000-0000-0000-000000000002'
              dados: {}
      responses:
        '200':
          description: 'Qualquer 2xx recebido em até 10 segundos confirma a entrega.'
