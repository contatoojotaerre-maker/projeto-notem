      responses:
        "200":
          description: Empresa alterada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empresa"
              examples:
                empresaDesativada:
                  $ref: "#/components/examples/EmpresaDesativada"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "404":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
        "409":
          description: CNPJ_IMUTAVEL, ID_EXTERNO_DUPLICADO, EMPRESA_DUPLICADA ou IDEMPOTENCIA_CONFLITO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroCnpjImutavel:
                  $ref: "#/components/examples/ErroCnpjImutavel"
                erroIdExterno:
                  $ref: "#/components/examples/ErroIdExterno"
