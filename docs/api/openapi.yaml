components:
  securitySchemes:
    chaveIntegracao:
      type: http
      scheme: bearer
      description: >-
        Chave da integração: ntm_homolog_... (homologação) ou ntm_prod_... (produção). Não expira; vale até ser revogada (efeito imediato). Até duas chaves
        ativas por integração e ambiente.
  headers:
    XRequestId:
      description: Identificador da requisição (informe ao suporte)
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Chave de idempotência (até 100 caracteres) aceita em POST, PATCH, PUT e DELETE; vale 24 h por integração e ambiente, exceto emissão, cancelamento,
        análise e substituição de notas (associação duradoura ao pedido). Mesmo conteúdo devolve a mesma resposta (cabeçalho Idempotent-Replayed true); conteúdo
        diferente devolve 409 IDEMPOTENCIA_CONFLITO. Obrigatória em emissão, cancelamento e substituição.
      schema:
        type: string
        maxLength: 100
    Limite:
      name: limite
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EmpresaId:
      name: id
      in: path
      required: true
      description: Empresa da organização da chave (de outra organização → 404). UUID (RFC 9562); fora do padrão → 400 REQUISICAO_INVALIDA com campo id.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  schemas:
    NotaEntrada:
      type: object
      additionalProperties: false
      required:
        - valores
      description: >-
        Os textos são ajustados antes da conferência (por exemplo, aspas e travessões viram equivalentes aceitos) e a nota usa o texto ajustado; caracteres
        sem equivalente, como emojis, retornam 422 com a mensagem "contém caracteres não aceitos pela NFS-e". Indique a empresa de uma única forma, o serviço
        de uma única forma e o tomador de no máximo uma forma. Com ISS retido pelo tomador, o tomador precisa de CPF/CNPJ e endereço completo no Brasil.
      properties:
        empresa_id:
          type: string
          format: uuid
        empresa_id_externo:
          type: string
          minLength: 1
          maxLength: 100
        id_externo:
          type:
            - string
            - "null"
          maxLength: 100
          description: Único por organização
        servico_id:
          type: string
          format: uuid
        servico_id_externo:
          type: string
          minLength: 1
          maxLength: 100
        competencia:
          type: string
          format: date
          description: Não pode ser futura; padrão data atual em Brasília
        descricao:
          type: string
          minLength: 1
          maxLength: 2000
        tomador:
          oneOf:
            - $ref: "#/components/schemas/Tomador"
            - type: "null"
        tomador_id:
          type: string
          format: uuid
        tomador_id_externo:
          type: string
          maxLength: 100
        valores:
          type: object
          additionalProperties: false
          required:
            - servico
          properties:
            servico:
              $ref: "#/components/schemas/Valor"
            desconto_incondicionado:
              $ref: "#/components/schemas/Valor"
              description: Zero não é enviado ao governo, que só aceita desconto maior que zero e menor que o valor do serviço.
            desconto_condicionado:
              $ref: "#/components/schemas/Valor"
              description: Zero não é enviado ao governo, que só aceita desconto maior que zero e menor que o valor do serviço.
        retencao_iss:
          type:
            - string
            - "null"
          enum:
            - nao_retido
            - retido_tomador
            - retido_intermediario
            - null
        aliquota_iss_simples:
          oneOf:
            - $ref: "#/components/schemas/Percentual"
            - type: "null"
        local_prestacao:
          type:
            - object
            - "null"
          properties:
            codigo_municipio:
              $ref: "#/components/schemas/CodigoMunicipio"
        informacoes_complementares:
