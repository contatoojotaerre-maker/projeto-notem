          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
    put:
      tags:
        - Configuração fiscal
      operationId: gravarConfiguracaoFiscal
      x-titulo: Gravar configuração fiscal
      summary: "Grava como a empresa é tributada e recusa combinações que o governo não aceita."
      description: |-
        Envie a configuração completa: situação no Simples Nacional, regime de apuração, regime especial e forma de informar os tributos aproximados. O campo `serie_dps` é ignorado, porque a série de numeração é atribuída pela notem.

        **Reenvie SEMPRE pis_cofins em cada PUT para manter a configuração.** O PUT substitui a configuração inteira: omitir pis_cofins ou enviar null remove a escolha anterior, mesmo ao alterar outro campo. A única combinação suportada é {"cst":"99","tipo_retencao":"0"}; qualquer outra combinação ou configuração parcial retorna 422 REGRA_DE_NEGOCIO, campo pis_cofins, mensagem "combinação de PIS/COFINS ainda não suportada". A escolha é por empresa, sem padrão automático, e não altera notas já criadas. A exceção existente de imprimir_canhoto_danfse continua preservando a preferência quando ausente.

        A notem recusa com 422, indicando o campo e a regra, as combinações que o governo rejeitaria depois, na emissão. Por exemplo, empresa fora do Simples Nacional precisa informar os tributos aproximados por esfera (federal, estadual e municipal), e MEI não pode ter regime especial. As regras completas estão no guia [Configuração fiscal](https://docs.notemfiscal.com.br/guias/configuracao-fiscal).
      parameters:
