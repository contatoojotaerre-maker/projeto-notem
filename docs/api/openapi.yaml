openapi: 3.1.0
info:
  title: API da notem
  version: 1.0.0
  description: >
    API para emissão e gestão de NFS-e (padrão nacional) por sistemas parceiros.

    Documentação: https://docs.notemfiscal.com.br. Campos em português; valores monetários como texto ("150.00").

    Toda rota tem limites de uso por chave e ambiente (https://docs.notemfiscal.com.br/primeiros-passos/limites): ao exceder, responde 429 LIMITE_EXCEDIDO com
    Retry-After.

    Corpo acima de 200 KB responde 413.

    Todos os exemplos usam dados fictícios.
  x-atualizado: "2026-11-17"
servers:
  - url: https://app.notemfiscal.com.br/api/v1
    description: API oficial da notem
security:
  - chaveIntegracao: []
tags:
  - name: Status
    description: Verificação da chave e do ambiente
  - name: Empresas
    description: Cadastro das empresas emitentes (compartilhadas entre ambientes)
  - name: Configuração fiscal
    description: Simples Nacional, regimes e tributos aproximados da empresa
  - name: Certificado
    description: Certificado digital A1 da empresa
  - name: Serviços
    description: Modelos de serviço da empresa, com código nacional e classificação IBS/CBS
  - name: Tomadores
    description: Clientes cadastrados de cada empresa
  - name: Situação da empresa
    description: Se a empresa está pronta para emitir e se o município atende o ambiente
  - name: Sincronização
    description: Situação da sincronização com o Ambiente de Dados Nacional
  - name: Notas
    description: Emissão, consulta, cancelamento e substituição de NFS-e
  - name: Notas recebidas
    description: Notas em que a empresa é tomadora ou intermediária
  - name: Catálogos
    description: Catálogos oficiais somente leitura
paths:
  /notas:
    get:
      tags:
        - Notas
      operationId: listarNotas
      summary: Lista notas da organização no ambiente da chave
      description: >-
        Lista paginada das notas da organização no ambiente da chave, da mais recente para a mais antiga. Inclui notas emitidas fora da notem (`origem:
        externa`).
      parameters:
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Cursor"
        - name: empresa_id
          in: query
          schema:
            type: string
            format: uuid
        - name: empresa_id_externo
          in: query
          schema:
            type: string
        - name: situacao
          in: query
          schema:
            type: string
            enum:
              - processando
              - em_verificacao
              - autorizada
              - rejeitada
              - cancelamento_em_analise
              - cancelada
              - substituida
              - cancelada_prefeitura
        - name: id_externo
          in: query
          schema:
            type: string
        - name: tomador_documento
          in: query
          schema:
            type: string
        - name: emitida_de
          in: query
          schema:
            type: string
            format: date
        - name: emitida_ate
          in: query
          schema:
            type: string
            format: date
        - name: origem
          in: query
          description: notem = emitidas pela notem; externa = emitidas fora da notem por empresas da organização (trazidas pela sincronização)
          schema:
            type: string
            enum:
              - notem
              - externa
      responses:
        "200":
          description: Lista paginada de notas
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items:
                      $ref: "#/components/schemas/Nota"
                  proximo_cursor:
                    type:
                      - string
                      - "null"
              examples:
                listaNotas:
                  $ref: "#/components/examples/ListaNotas"
        "400":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroBusca:
                  $ref: "#/components/examples/ErroBusca"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
    post:
      tags:
        - Notas
      operationId: emitirNota
      summary: Emite NFS-e com numeração e idempotência definitivas
      description: |
        Valida empresa, serviço, tomador, E0202, E0172/E0174/E0175, E0204/E0237 e tributos antes de numerar.
        A associação entre a chave e a nota é permanente por integração e ambiente, sem expiração em 24 horas.
        Repetição em processamento/verificação retorna 202 com a nota atual; conteúdo diferente retorna 409.
        Falha comprovada anterior ao envio permite repetir a mesma DPS/número. Ambiguidade vai para consulta.
        A resposta pode levar cerca de 20 segundos. E0014 exclusiva permite avançar até cinco números; resultados incertos são confirmados por consulta.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotaEntrada"
            examples:
              notaEntrada:
                $ref: "#/components/examples/NotaEntrada"
      responses:
        "201":
          description: Nota autorizada (incluindo repetição)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaAutorizada:
                  $ref: "#/components/examples/NotaAutorizada"
        "202":
          description: Nota em processamento ou verificação automática
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaEmVerificacao:
                  $ref: "#/components/examples/NotaEmVerificacao"
        "400":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroIdempotencyKey:
                  $ref: "#/components/examples/ErroIdempotencyKey"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
        "404":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
        "409":
          description: IDEMPOTENCIA_CONFLITO, ID_EXTERNO_DUPLICADO ou configuração alterada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroIdempotencia:
                  $ref: "#/components/examples/ErroIdempotencia"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "422":
          description: REGRA_DE_NEGOCIO, EMPRESA_NAO_PRONTA ou REJEITADO_GOVERNO (detalhes incluem nota_id e mensagens originais)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroRejeitadoGoverno:
                  $ref: "#/components/examples/ErroRejeitadoGoverno"
                erroEmpresaNaoPronta:
                  $ref: "#/components/examples/ErroEmpresaNaoPronta"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "503":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroGoverno:
                  $ref: "#/components/examples/ErroGoverno"
  /notas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: "UUID (RFC 9562). Fora do padrão: 400 REQUISICAO_INVALIDA com campo igual ao nome do parâmetro."
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Notas
      operationId: consultarNota
      summary: Consulta nota (outra organização ou ambiente retorna 404)
      description: Consulta a nota completa. Nota de outra organização ou de outro ambiente responde 404.
      responses:
        "200":
          description: Nota completa
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaAutorizada:
                  $ref: "#/components/examples/NotaAutorizada"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
        "404":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
  /notas/{id}/xml:
    parameters:
      - name: id
        in: path
        required: true
        description: "UUID (RFC 9562). Fora do padrão: 400 REQUISICAO_INVALIDA com campo igual ao nome do parâmetro."
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Notas
      operationId: baixarXmlNota
      summary: Baixa XML oficial da NFS-e autorizada
      description: XML oficial da NFS-e autorizada, exatamente como devolvido pelo governo.
      responses:
        "200":
          description: XML sem alterações
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/xml:
              schema:
                type: string
              examples:
                xmlNota:
                  $ref: "#/components/examples/XmlNota"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
        "404":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
  /notas/{id}/cancelar:
    parameters:
      - name: id
        in: path
        required: true
        description: "UUID (RFC 9562). Fora do padrão: 400 REQUISICAO_INVALIDA com campo igual ao nome do parâmetro."
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Notas
      operationId: cancelarNota
      summary: Cancela NFS-e autorizada (evento 101101)
      description: >
        Somente nota autorizada do ambiente da chave e sem outro pedido em andamento. Idempotency-Key obrigatória e associada de forma duradoura ao pedido.

        Recusas por prazo, valor, tomador não identificado ou tributos recolhidos trazem pode_solicitar_analise true.

        Se o governo indicar cancelamento já existente, a notem confirma o evento e, encontrado, a nota fica cancelada ("Cancelamento registrado fora da
        notem").
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoCancelamento"
            examples:
              pedidoCancelamento:
                $ref: "#/components/examples/PedidoCancelamento"
      responses:
        "200":
          description: Cancelamento registrado; nota com situacao cancelada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaCancelada:
                  $ref: "#/components/examples/NotaCancelada"
        "202":
          description: Aguardando confirmação do governo; nota segue autorizada com operacao_pendente
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaCancelamentoPendente:
                  $ref: "#/components/examples/NotaCancelamentoPendente"
        "400":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroValidacao:
                  $ref: "#/components/examples/ErroValidacao"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
        "404":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
        "409":
          description: CONFLITO (nota não autorizada, pedido ou substituição em andamento) ou IDEMPOTENCIA_CONFLITO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroConflitoNota:
                  $ref: "#/components/examples/ErroConflitoNota"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "422":
          description: REGRA_DE_NEGOCIO (justificativa, certificado), EMPRESA_NAO_PRONTA ou REJEITADO_GOVERNO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroCancelamentoMunicipio:
                  $ref: "#/components/examples/ErroCancelamentoMunicipio"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "503":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroGoverno:
                  $ref: "#/components/examples/ErroGoverno"
  /notas/{id}/solicitar-analise-cancelamento:
    parameters:
      - name: id
        in: path
        required: true
        description: "UUID (RFC 9562). Fora do padrão: 400 REQUISICAO_INVALIDA com campo igual ao nome do parâmetro."
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Notas
      operationId: solicitarAnaliseCancelamento
      summary: Solicita análise fiscal do cancelamento à prefeitura (evento 101103)
      description: Mesmas regras e respostas do cancelamento. Registrado o pedido, a nota fica cancelamento_em_analise até a decisão da prefeitura.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoCancelamento"
            examples:
              pedidoAnalise:
                $ref: "#/components/examples/PedidoAnalise"
      responses:
        "200":
          description: Pedido registrado; nota com situacao cancelamento_em_analise
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaEmAnalise:
                  $ref: "#/components/examples/NotaEmAnalise"
        "202":
          description: Aguardando confirmação do governo
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaCancelamentoPendente:
                  $ref: "#/components/examples/NotaCancelamentoPendente"
        "400":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroValidacao:
                  $ref: "#/components/examples/ErroValidacao"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
        "404":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
        "409":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroConflitoNota:
                  $ref: "#/components/examples/ErroConflitoNota"
        "422":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroEmpresaNaoPronta:
                  $ref: "#/components/examples/ErroEmpresaNaoPronta"
        "503":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroGoverno:
                  $ref: "#/components/examples/ErroGoverno"
  /notas/{id}/substituir:
    parameters:
      - name: id
        in: path
        required: true
        description: "UUID (RFC 9562). Fora do padrão: 400 REQUISICAO_INVALIDA com campo igual ao nome do parâmetro."
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Notas
      operationId: substituirNota
      summary: Emite nota substituta (grupo subst)
      description: |
        Campos não enviados vêm da nota original; a empresa é sempre a da original. Validações de emissão e E0060/E0061 ocorrem antes de numerar.
        A original só fica substituida quando a nova é autorizada; rejeitada a nova, a original não muda. Respostas iguais a POST /notas.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoSubstituicao"
            examples:
              pedidoSubstituicao:
                $ref: "#/components/examples/PedidoSubstituicao"
      responses:
        "201":
          description: Nota substituta autorizada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaSubstituta:
                  $ref: "#/components/examples/NotaSubstituta"
        "202":
          description: Nota substituta em processamento ou verificação
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaEmVerificacao:
                  $ref: "#/components/examples/NotaEmVerificacao"
        "400":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroValidacao:
                  $ref: "#/components/examples/ErroValidacao"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
        "404":
          description: Erro no formato padrão (https://docs.notemfiscal.com.br/primeiros-passos/erros)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
        "409":
          description: CONFLITO (original não autorizada, pedido ou substituição em andamento) ou IDEMPOTENCIA_CONFLITO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroConflitoNota:
