      operationId: excluirEmpresa
      x-titulo: Excluir empresa
      summary: "Exclui uma empresa que nunca emitiu nota."
      description: |-
        Use para remover um cadastro feito por engano. A exclusão é definitiva e remove também os serviços, a configuração fiscal e o certificado guardado.

        Só é permitida se a empresa nunca usou um número de nota e não tem notas em nenhum ambiente, porque números já usados precisam continuar registrados. Caso contrário, a resposta é 409 EMPRESA_POSSUI_HISTORICO; desative a empresa com `ativa: false`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Excluída (serviços, certificado e configuração removidos)
        "404":
