openapi: 3.1.0
info:
  title: API da notem
  version: "1.0.0"
  description: |
    API para emissão e gestão de NFS-e (padrão nacional) por sistemas parceiros.
    Leia primeiro docs/api/convencoes.md. Campos em português; valores monetários como texto ("150.00").
    Toda rota tem limites de uso por chave e ambiente (convencoes.md, seção 9): ao exceder, responde 429 LIMITE_EXCEDIDO com Retry-After.
    Corpo acima de 200 KB responde 413.
servers:
  - url: https://app.notemfiscal.com.br/api/v1
    description: "API oficial da notem"
security:
  - chaveIntegracao: []
tags:
  - name: Geral
    description: "Verificação da chave e do ambiente"
  - name: Notas
    description: "Emissão e consulta de NFS-e e acompanhamento automático"
  - name: Empresas
    description: "Cadastro e preparação das empresas emitentes (compartilhadas entre ambientes)"
  - name: Catálogos
    description: "Catálogos oficiais somente leitura"
paths:
  /notas:
    get:
      tags: [Notas]
      summary: Lista notas da organização no ambiente da chave
      parameters:
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: empresa_id, in: query, schema: { type: string, format: uuid } }
        - { name: empresa_id_externo, in: query, schema: { type: string } }
        - { name: situacao, in: query, schema: { type: string, enum: [processando, em_verificacao, autorizada, rejeitada, cancelamento_em_analise, cancelada, substituida, cancelada_prefeitura] } }
        - { name: id_externo, in: query, schema: { type: string } }
        - { name: tomador_documento, in: query, schema: { type: string } }
        - { name: emitida_de, in: query, schema: { type: string, format: date } }
        - { name: emitida_ate, in: query, schema: { type: string, format: date } }
        - { name: origem, in: query, description: "notem = emitidas pela notem; externa = emitidas fora da notem por empresas da organização (trazidas pela sincronização)", schema: { type: string, enum: [notem, externa] } }
      responses:
        "200": { description: "Lista paginada de notas", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/json: { schema: { type: object, properties: { dados: { type: array, items: { $ref: "#/components/schemas/Nota" } }, proximo_cursor: { type: [string, "null"] } } } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
    post:
      tags: [Notas]
      summary: Emite NFS-e com numeração e idempotência definitivas
      description: |
        Valida empresa, serviço, tomador, E0202, E0172/E0174/E0175, E0204/E0237 e tributos antes de numerar.
        A associação entre a chave e a nota é permanente por integração e ambiente, sem expiração em 24 horas.
        Repetição em processamento/verificação retorna 202 com a nota atual; conteúdo diferente retorna 409.
        Falha comprovada anterior ao envio permite repetir a mesma DPS/número. Ambiguidade vai para consulta.
        A resposta pode levar cerca de 20 segundos. E0014 exclusiva permite avançar até cinco números; resultados incertos são confirmados por consulta.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NotaEntrada" } } } }
      responses:
        "201": { description: "Nota autorizada (incluindo repetição)", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Nota" } } } }
        "202": { description: "Nota em processamento ou verificação automática", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Nota" } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "IDEMPOTENCIA_CONFLITO, ID_EXTERNO_DUPLICADO ou configuração alterada", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
        "422": { description: "REGRA_DE_NEGOCIO, EMPRESA_NAO_PRONTA ou REJEITADO_GOVERNO (detalhes incluem nota_id e mensagens originais)", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
        "503": { $ref: "#/components/responses/Erro" }
  /notas/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Notas]
      summary: Consulta nota (outra organização ou ambiente retorna 404)
      responses:
        "200": { description: "Nota completa", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Nota" } } } }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
  /notas/{id}/xml:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Notas]
      summary: Baixa XML oficial da NFS-e autorizada
      responses:
        "200": { description: "XML sem alterações", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/xml: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
  /notas/{id}/cancelar:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Notas]
      summary: Cancela NFS-e autorizada (evento 101101)
      description: |
        Somente nota autorizada do ambiente da chave e sem outro pedido em andamento. Idempotency-Key obrigatória e associada de forma duradoura ao pedido.
        Recusas por prazo, valor, tomador não identificado ou tributos recolhidos trazem pode_solicitar_analise true.
        Se o governo indicar cancelamento já existente, a notem confirma o evento e, encontrado, a nota fica cancelada ("Cancelamento registrado fora da notem").
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PedidoCancelamento" } } } }
      responses:
        "200": { description: "Cancelamento registrado; nota com situacao cancelada", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Nota" } } } }
        "202": { description: "Aguardando confirmação do governo; nota segue autorizada com operacao_pendente", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Nota" } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "CONFLITO (nota não autorizada, pedido ou substituição em andamento) ou IDEMPOTENCIA_CONFLITO", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
        "422": { description: "REGRA_DE_NEGOCIO (justificativa, certificado), EMPRESA_NAO_PRONTA ou REJEITADO_GOVERNO", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
        "503": { $ref: "#/components/responses/Erro" }
  /notas/{id}/solicitar-analise-cancelamento:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Notas]
      summary: Solicita análise fiscal do cancelamento à prefeitura (evento 101103)
      description: "Mesmas regras e respostas do cancelamento. Registrado o pedido, a nota fica cancelamento_em_analise até a decisão da prefeitura."
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PedidoCancelamento" } } } }
      responses:
        "200": { description: "Pedido registrado; nota com situacao cancelamento_em_analise", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Nota" } } } }
        "202": { description: "Aguardando confirmação do governo", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Nota" } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
        "503": { $ref: "#/components/responses/Erro" }
  /notas/{id}/substituir:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Notas]
      summary: Emite nota substituta (grupo subst)
      description: |
        Campos não enviados vêm da nota original; a empresa é sempre a da original. Validações de emissão e E0060/E0061 ocorrem antes de numerar.
        A original só fica substituida quando a nova é autorizada; rejeitada a nova, a original não muda. Respostas iguais a POST /notas.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PedidoSubstituicao" } } } }
      responses:
        "201": { description: "Nota substituta autorizada", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Nota" } } } }
        "202": { description: "Nota substituta em processamento ou verificação", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Nota" } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "CONFLITO (original não autorizada, pedido ou substituição em andamento) ou IDEMPOTENCIA_CONFLITO", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
        "422": { description: "REGRA_DE_NEGOCIO (inclui E0042, E0060, E0061, justificativa), EMPRESA_NAO_PRONTA ou REJEITADO_GOVERNO", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
        "503": { $ref: "#/components/responses/Erro" }
  /notas/{id}/eventos/{codigo}/xml:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: codigo, in: path, required: true, schema: { type: string, enum: ["101101", "101103"] } }
    get:
      tags: [Notas]
      summary: Baixa o XML oficial de um evento registrado
      responses:
        "200": { description: "XML do evento sem alterações", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/xml: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
  /empresas/{id}/tomadores:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }]
    get:
      tags: [Empresas]
      summary: Lista tomadores da empresa
      parameters:
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: documento, in: query, schema: { type: string } }
        - { name: id_externo, in: query, schema: { type: string } }
        - { name: busca, in: query, schema: { type: string } }
      responses:
        "200": { description: "Lista paginada", content: { application/json: { schema: { type: object, properties: { dados: { type: array, items: { $ref: "#/components/schemas/Tomador" } }, proximo_cursor: { type: [string, "null"] } } } } } }
        "404": { $ref: "#/components/responses/Erro" }
    post:
      tags: [Empresas]
      summary: Cadastra tomador (id_externo único por empresa)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Tomador" } } } }
      responses:
        "201": { description: "Tomador criado", content: { application/json: { schema: { $ref: "#/components/schemas/Tomador" } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "409": { description: "ID_EXTERNO_DUPLICADO por empresa ou IDEMPOTENCIA_CONFLITO" }
  /empresas/{id}/tomadores/{tomador_id}:
    parameters:
      - { $ref: "#/components/parameters/EmpresaId" }
      - { name: tomador_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Empresas]
      summary: Consulta tomador
      responses:
        "200": { description: "Tomador", content: { application/json: { schema: { $ref: "#/components/schemas/Tomador" } } } }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [Empresas]
      summary: Altera campos enviados do tomador
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TomadorAlteracao" } } } }
      responses:
        "200": { description: "Tomador alterado", content: { application/json: { schema: { $ref: "#/components/schemas/Tomador" } } } }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "ID_EXTERNO_DUPLICADO por empresa ou IDEMPOTENCIA_CONFLITO" }
  /notas/{id}/pdf:
    get:
      tags: [Notas]
      summary: Baixa DANFSe v2.0 em PDF
      description: "Gerado do XML autorizado e situação atual; autorizada, cancelada, cancelada_prefeitura ou substituida. Canhoto opcional; mesma organização e ambiente da chave."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: "DANFSe A4 em página única"
          headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" }, Content-Disposition: { schema: { type: string } } }
          content: { application/pdf: { schema: { type: string, format: binary } } }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
  /status:
    get:
      tags: [Geral]
      summary: Verifica a chave e informa o ambiente
      description: |
        Use para testar a integração. Não consome nada e não acessa o governo.
        O ambiente, a organização e a integração são determinados exclusivamente pela chave.
      responses:
        "200":
          description: "Chave válida"
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [ambiente, organizacao, integracao]
                properties:
                  ambiente: { $ref: "#/components/schemas/Ambiente" }
                  organizacao:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      nome: { type: string }
                  integracao:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      nome: { type: string }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
  /empresas:
    get:
      tags: [Empresas]
      summary: Lista as empresas da organização da chave
      parameters:
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: cnpj, in: query, schema: { $ref: "#/components/schemas/Cnpj" } }
        - { name: id_externo, in: query, schema: { type: string, maxLength: 100 } }
        - { name: ativa, in: query, schema: { type: boolean } }
        - { name: busca, in: query, description: "Razão social ou nome fantasia (2+ caracteres)", schema: { type: string, minLength: 2 } }
      responses:
        "200": { description: "Lista paginada", content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/ListaPaginada" }, { properties: { dados: { type: array, items: { $ref: "#/components/schemas/Empresa" } } } }] } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
    post:
      tags: [Empresas]
      summary: Cadastra uma empresa
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EmpresaEntrada" } } } }
      responses:
        "201": { description: "Empresa criada", content: { application/json: { schema: { $ref: "#/components/schemas/Empresa" } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "409": { description: "EMPRESA_DUPLICADA (detalhes traz o id existente), ID_EXTERNO_DUPLICADO ou IDEMPOTENCIA_CONFLITO", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
  /empresas/{id}:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }]
    get:
      tags: [Empresas]
      summary: Consulta uma empresa
      responses:
        "200": { description: "Empresa", content: { application/json: { schema: { $ref: "#/components/schemas/Empresa" } } } }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [Empresas]
      summary: Altera os campos enviados (ativa false desativa; true reativa)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EmpresaAlteracao" } } } }
      responses:
        "200": { description: "Empresa alterada", content: { application/json: { schema: { $ref: "#/components/schemas/Empresa" } } } }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "CNPJ_IMUTAVEL, ID_EXTERNO_DUPLICADO, EMPRESA_DUPLICADA ou IDEMPOTENCIA_CONFLITO", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
    delete:
      tags: [Empresas]
      summary: Exclui definitivamente (somente se nunca reservou número de DPS)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: "Excluída (serviços, certificado e configuração removidos)" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "EMPRESA_POSSUI_HISTORICO — use ativa false", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
  /empresas/{id}/configuracao-fiscal:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }]
    get:
      tags: [Empresas]
      summary: Consulta a configuração fiscal
      responses:
        "200": { description: "Configuração", content: { application/json: { schema: { $ref: "#/components/schemas/ConfiguracaoFiscal" } } } }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [Empresas]
      summary: Grava a configuração fiscal (serie_dps é ignorada; atribuída automaticamente)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfiguracaoFiscal" }, example: { simples_nacional: me_epp, regime_apuracao_simples: dentro_do_simples, regime_especial: nenhum, tributos_aproximados: { modo: percentual_simples, percentual_simples: "6.00", federal: null, estadual: null, municipal: null }, aliquota_iss_simples: null } } } }
      responses:
        "200": { description: "Configuração gravada", content: { application/json: { schema: { $ref: "#/components/schemas/ConfiguracaoFiscal" } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { description: "REGRA_DE_NEGOCIO com detalhes por campo (ex.: E0710/E0712/E0713, alíquota do ISS no Simples)", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
  /empresas/{id}/certificado:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }]
    get:
      tags: [Empresas]
      summary: Metadados do certificado ativo
      responses:
        "200": { description: "Certificado", content: { application/json: { schema: { $ref: "#/components/schemas/Certificado" } } } }
        "404": { $ref: "#/components/responses/Erro" }
    post:
      tags: [Empresas]
      summary: Envia ou substitui o certificado A1 (arquivo e senha nunca são devolvidos nem registrados)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [arquivo_base64, senha], additionalProperties: false, properties: { arquivo_base64: { type: string, description: ".pfx/.p12 de até 100 KB em base64" }, senha: { type: string } } } } } }
      responses:
        "200": { description: "Certificado aceito", content: { application/json: { schema: { $ref: "#/components/schemas/Certificado" } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { description: "CERTIFICADO_SENHA_OU_ARQUIVO_INVALIDO, CERTIFICADO_SEM_CHAVE_PRIVADA, CERTIFICADO_VENCIDO, CERTIFICADO_AINDA_NAO_VALIDO, CERTIFICADO_CNPJ_NAO_ENCONTRADO ou CERTIFICADO_CNPJ_DIVERGENTE", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
  /empresas/{id}/servicos:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }]
    get:
      tags: [Empresas]
      summary: Lista os serviços da empresa
      parameters: [{ $ref: "#/components/parameters/Limite" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200": { description: "Lista paginada", content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/ListaPaginada" }, { properties: { dados: { type: array, items: { $ref: "#/components/schemas/Servico" } } } }] } } } }
    post:
      tags: [Empresas]
      summary: Cadastra um serviço
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Servico" } } } }
      responses:
        "201": { description: "Serviço criado", content: { application/json: { schema: { $ref: "#/components/schemas/Servico" } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "409": { description: "ID_EXTERNO_DUPLICADO", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
        "422": { $ref: "#/components/responses/Erro" }
  /empresas/{id}/servicos/{servico_id}:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }, { name: servico_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Empresas]
      summary: Consulta um serviço
      responses:
        "200": { description: "Serviço", content: { application/json: { schema: { $ref: "#/components/schemas/Servico" } } } }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [Empresas]
      summary: Altera um serviço (ativo false desativa; não há exclusão)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Servico" } } } }
      responses:
        "200": { description: "Serviço alterado", content: { application/json: { schema: { $ref: "#/components/schemas/Servico" } } } }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /empresas/{id}/situacao:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }]
    get:
      tags: [Empresas]
      summary: Pronta para emitir? (ambiente da chave)
      responses:
        "200": { description: "Situação", content: { application/json: { schema: { $ref: "#/components/schemas/Situacao" } } } }
        "404": { $ref: "#/components/responses/Erro" }
  /empresas/{id}/situacao/verificar-municipio:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }]
    post:
      tags: [Empresas]
      summary: Consulta o convênio do município no governo e devolve a situação atualizada
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: "Situação atualizada", content: { application/json: { schema: { $ref: "#/components/schemas/Situacao" } } } }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { description: "REGRA_DE_NEGOCIO — exige certificado válido", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
        "429": { description: "LIMITE_EXCEDIDO — 1 por minuto por empresa e ambiente; ver Retry-After", headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
  /empresas/{id}/sincronizacao:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }]
    get:
      tags: [Empresas]
      summary: "Situação da sincronização com o ADN (somente consulta, ambiente da chave)"
      description: "A sincronização é iniciada apenas no painel. A API não oferece sincronização por NSU."
      responses:
        "200": { description: "Situação da sincronização", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Sincronizacao" } } } }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
  /empresas/{id}/notas-recebidas:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }]
    get:
      tags: [Empresas]
      summary: "Notas em que a empresa é tomadora ou intermediária (ambiente da chave)"
      description: "Exige prova de posse: a empresa precisa ter tido certificado digital cadastrado nesta organização."
      parameters:
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: situacao, in: query, schema: { type: string, enum: [autorizada, cancelamento_em_analise, cancelada, substituida, cancelada_prefeitura] } }
        - { name: prestador_cnpj, in: query, schema: { $ref: "#/components/schemas/Cnpj" } }
        - { name: emitida_de, in: query, schema: { type: string, format: date } }
        - { name: emitida_ate, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: "Lista paginada", headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }, content: { application/json: { schema: { type: object, properties: { dados: { type: array, items: { $ref: "#/components/schemas/NotaRecebida" } }, proximo_cursor: { type: [string, "null"] } } } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
  /empresas/{id}/notas-recebidas/{nota_id}:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }, { name: nota_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Empresas]
      summary: "Consulta nota recebida"
      responses:
        "200": { description: "Nota recebida", content: { application/json: { schema: { $ref: "#/components/schemas/NotaRecebida" } } } }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
  /empresas/{id}/notas-recebidas/{nota_id}/xml:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }, { name: nota_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Empresas]
      summary: "XML oficial da nota recebida, sem alterações"
      responses:
        "200": { description: "XML oficial", content: { application/xml: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
  /empresas/{id}/notas-recebidas/{nota_id}/pdf:
    parameters: [{ $ref: "#/components/parameters/EmpresaId" }, { name: nota_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Empresas]
      summary: "DANFSe da nota recebida, gerado do XML oficial"
      responses:
        "200": { description: "PDF", content: { application/pdf: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/AutenticacaoInvalida" }
        "404": { $ref: "#/components/responses/Erro" }
  /catalogos/municipios:
    get:
      tags: [Catálogos]
      summary: "Municípios (nome sem acento ou código IBGE)"
      parameters: [{ $ref: "#/components/parameters/Limite" }, { $ref: "#/components/parameters/Cursor" }, { name: busca, in: query, schema: { type: string, minLength: 2 } }]
      responses:
        "200": { description: "Lista paginada", content: { application/json: { schema: { $ref: "#/components/schemas/ListaPaginada" } } } }
        "400": { $ref: "#/components/responses/Erro" }
  /catalogos/servicos:
    get:
      tags: [Catálogos]
      summary: "Códigos nacionais de serviço (descrição ou código)"
      parameters: [{ $ref: "#/components/parameters/Limite" }, { $ref: "#/components/parameters/Cursor" }, { name: busca, in: query, schema: { type: string, minLength: 2 } }]
      responses:
        "200": { description: "Lista paginada", content: { application/json: { schema: { $ref: "#/components/schemas/ListaPaginada" } } } }
        "400": { $ref: "#/components/responses/Erro" }
  /catalogos/nbs:
    get:
      tags: [Catálogos]
      summary: "Códigos NBS (descrição ou código)"
      parameters: [{ $ref: "#/components/parameters/Limite" }, { $ref: "#/components/parameters/Cursor" }, { name: busca, in: query, schema: { type: string, minLength: 2 } }]
      responses:
        "200": { description: "Lista paginada", content: { application/json: { schema: { $ref: "#/components/schemas/ListaPaginada" } } } }
        "400": { $ref: "#/components/responses/Erro" }
  /catalogos/classificacoes-tributarias:
    get:
      tags: [Catálogos]
      summary: "Classificações tributárias do IBS/CBS aceitas na NFS-e (cClassTrib)"
      description: "Tabela oficial (73 classificações com NFS-e = Sim). suportada = false indica classificação que a notem ainda não aceita (tributação regular, crédito presumido, diferimento, CST 800/811 e doações 410003/410026), com o motivo."
      parameters: [{ $ref: "#/components/parameters/Limite" }, { $ref: "#/components/parameters/Cursor" }, { name: busca, in: query, schema: { type: string, minLength: 2 } }]
      responses:
        "200": { description: "Lista paginada", content: { application/json: { schema: { $ref: "#/components/schemas/ListaPaginada" } } } }
        "400": { $ref: "#/components/responses/Erro" }
  /catalogos/indicadores-operacao:
    get:
      tags: [Catálogos]
      summary: "Indicadores de operação do IBS/CBS (cIndOp, Anexo VII v1.03)"
      description: "Por padrão lista só os 28 indicadores ativos. incluir_inativos=true inclui os 5 retirados da tabela oficial (ativo = false), que não podem ser escolhidos em novos cadastros."
      parameters: [{ $ref: "#/components/parameters/Limite" }, { $ref: "#/components/parameters/Cursor" }, { name: busca, in: query, schema: { type: string, minLength: 2 } }, { name: incluir_inativos, in: query, schema: { type: boolean, default: false } }]
      responses:
        "200": { description: "Lista paginada", content: { application/json: { schema: { $ref: "#/components/schemas/ListaPaginada" } } } }
        "400": { $ref: "#/components/responses/Erro" }
  /catalogos/sugestao-classificacao:
    get:
      tags: [Catálogos]
      summary: "Sugestão de NBS, classificação, indicador e atividade do Simples (Anexo VIII)"
      description: "Primeira opção da tabela oficial de correlação para o código de serviço, com as alternativas. Nunca é aplicada automaticamente; valores não aceitos na NFS-e, retirados ou não suportados vêm com aplicavel = false e o motivo."
      parameters: [{ name: codigo_servico, in: query, required: true, schema: { type: string, pattern: '^\d{6}$' } }]
      responses:
        "200": { description: "Sugestão", content: { application/json: { schema: { $ref: "#/components/schemas/SugestaoIbsCbs" } } } }
        "400": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
components:
  securitySchemes:
    chaveIntegracao:
      type: http
      scheme: bearer
      description: "Chave da integração: ntm_homolog_... (homologação) ou ntm_prod_... (produção). Não expira; vale até ser revogada (efeito imediato). Até duas chaves ativas por integração e ambiente."
  headers:
    XRequestId:
      description: "Identificador da requisição (informe ao suporte)"
      schema: { type: string }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Chave de idempotência (até 100 caracteres) aceita em POST, PATCH, PUT e DELETE; vale 24 h por integração e ambiente, exceto emissão, cancelamento, análise e substituição de notas (associação duradoura ao pedido). Mesmo conteúdo devolve a mesma resposta (cabeçalho Idempotent-Replayed true); conteúdo diferente devolve 409 IDEMPOTENCIA_CONFLITO. Obrigatória em emissão, cancelamento e substituição."
      schema: { type: string, maxLength: 100 }
    Limite:
      name: limite
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    EmpresaId:
      name: id
      in: path
      required: true
      description: "Empresa da organização da chave (de outra organização → 404)"
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  schemas:
    NotaEntrada:
      type: object
      additionalProperties: false
      required: [valores]
      description: "Textos são normalizados antes de validar e o texto normalizado é o enviado ao governo; caracteres sem equivalente retornam 422 (contém caracteres não aceitos pela NFS-e). Exatamente um seletor de empresa e um de serviço; no máximo um seletor de tomador. CPF/CNPJ/endereço nacional completos exigidos com retenção pelo tomador (E0204/E0237). E0202 e regras fiscais verificadas antes de numerar."
      properties:
        empresa_id: { type: string, format: uuid }
        empresa_id_externo: { type: string, minLength: 1, maxLength: 100 }
        id_externo: { type: [string, "null"], maxLength: 100, description: "Único por organização" }
        servico_id: { type: string, format: uuid }
        servico_id_externo: { type: string, minLength: 1, maxLength: 100 }
        competencia: { type: string, format: date, description: "Não pode ser futura; padrão data atual em Brasília" }
        descricao: { type: string, minLength: 1, maxLength: 2000 }
        tomador: { oneOf: [{ $ref: "#/components/schemas/Tomador" }, { type: "null" }] }
        tomador_id: { type: string, format: uuid }
        tomador_id_externo: { type: string, maxLength: 100 }
        valores:
          type: object
          additionalProperties: false
          required: [servico]
          properties:
            servico: { $ref: "#/components/schemas/Valor" }
            desconto_incondicionado: { $ref: "#/components/schemas/Valor", description: "Zero omitido na DPS (E0431)" }
            desconto_condicionado: { $ref: "#/components/schemas/Valor", description: "Zero omitido na DPS (E0432)" }
        retencao_iss: { type: [string, "null"], enum: [nao_retido, retido_tomador, retido_intermediario, null] }
        aliquota_iss_simples: { oneOf: [{ $ref: "#/components/schemas/Percentual" }, { type: "null" }] }
        local_prestacao: { type: [object, "null"], properties: { codigo_municipio: { $ref: "#/components/schemas/CodigoMunicipio" } } }
        informacoes_complementares: { type: [string, "null"], maxLength: 2000 }
    Nota:
      type: object
      properties:
        id: { type: string, format: uuid }
        id_externo: { type: [string, "null"] }
        origem: { type: string, enum: [notem, externa], description: "externa = emitida por outro sistema ou pelo Portal Nacional; somente leitura (cancelar, solicitar análise e substituir respondem 409 CONFLITO)" }
        empresa_id: { type: string, format: uuid }
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        situacao: { type: string, enum: [processando, em_verificacao, autorizada, rejeitada, cancelamento_em_analise, cancelada, substituida, cancelada_prefeitura] }
        restricoes: { type: array, items: { type: string } }
        manifestacao: { type: [object, "null"] }
        numero: { type: [string, "null"] }
        chave_acesso: { type: [string, "null"], pattern: "^[0-9]{9}[0-9A-Z]{14}[0-9]{27}$", description: "50 posições; as 14 do CNPJ do emitente podem conter letras" }
        serie_dps: { type: string }
        numero_dps: { type: string }
        competencia: { type: string, format: date }
        emitida_em: { type: string, format: date-time }
        autorizada_em: { type: [string, "null"], format: date-time }
        tomador: { oneOf: [{ $ref: "#/components/schemas/Tomador" }, { type: "null" }] }
        servico: { type: object, properties: { servico_id: { type: string, format: uuid }, codigo_servico: { type: string }, descricao: { type: string } } }
        valores:
          type: object
          properties:
            servico: { $ref: "#/components/schemas/Valor" }
            desconto_incondicionado: { $ref: "#/components/schemas/Valor" }
            desconto_condicionado: { $ref: "#/components/schemas/Valor" }
            base_calculo: { type: [string, "null"] }
            aliquota_iss: { type: [string, "null"] }
            valor_iss: { type: [string, "null"] }
            valor_liquido: { type: [string, "null"] }
            iss_retido: { type: boolean }
        local_prestacao: { type: object }
        ibs_cbs: { oneOf: [{ $ref: "#/components/schemas/IbsCbs" }, { type: "null" }] }
        erros_governo: { type: array, items: { type: object } }
        substitui_nota_id: { type: [string, "null"], format: uuid }
        substituida_por_nota_id: { type: [string, "null"], format: uuid }
        operacao_pendente:
          type: [object, "null"]
          description: "Pedido aguardando confirmação do governo; null quando não houver"
          properties:
            tipo: { type: string, enum: [cancelamento, analise_cancelamento] }
            estado: { type: string, enum: [em_verificacao] }
            desde: { type: [string, "null"], format: date-time }
        cancelamento:
          type: [object, "null"]
          description: "Último pedido de cancelamento ou análise fiscal; null quando nunca houve"
          properties:
            tipo: { type: string, enum: [cancelamento, analise_cancelamento] }
            motivo: { type: string, enum: [erro_emissao, servico_nao_prestado, outros] }
            justificativa: { type: string }
            solicitado_em: { type: [string, "null"], format: date-time }
            registrado_em: { type: [string, "null"], format: date-time }
            situacao: { type: string, enum: [em_verificacao, cancelado, em_analise, recusado, nao_registrado, nao_enviado] }
            pode_solicitar_analise: { type: boolean }
            registrado_fora_da_notem: { type: boolean }
            erros_governo: { type: array, items: { type: object } }
        links: { type: object, properties: { xml: { type: string, format: uri }, pdf: { type: string, format: uri }, consulta_publica: { type: [string, "null"], description: "https://www.nfse.gov.br/ConsultaPublica?tpc=1&chave={chave_acesso}; null somente sem chave válida" } } }
        criada_em: { type: string, format: date-time }
        atualizada_em: { type: string, format: date-time }
    Sincronizacao:
      type: object
      properties:
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        situacao: { type: string, enum: [nunca_sincronizada, em_andamento, atualizada, erro] }
        ultimo_nsu: { type: [integer, "null"] }
        ultima_consulta: { type: [string, "null"], format: date-time }
        proxima_consulta_permitida: { type: [string, "null"], format: date-time, description: "null quando já é possível sincronizar" }
        primeira_sincronizacao_concluida_em: { type: [string, "null"], format: date-time }
        documentos_importados: { type: integer }
        sincronizacao_em_andamento:
          type: [object, "null"]
          properties:
            tipo: { type: string, enum: [novidades, periodo] }
            meses: { type: [integer, "null"], enum: [1, 3, 6, 12, 24, null] }
            etapa: { type: string, enum: [busca_inicio_periodo, importacao] }
            documentos_importados: { type: integer }
            solicitada_em: { type: [string, "null"], format: date-time }
        ultima_sincronizacao:
          type: [object, "null"]
          properties:
            tipo: { type: string, enum: [novidades, periodo] }
            meses: { type: [integer, "null"] }
            resultado: { type: string, enum: [concluida, interrompida] }
            concluida_em: { type: [string, "null"], format: date-time }
            documentos_importados: { type: integer }
            mensagem: { type: [string, "null"] }
        ultimo_erro: { type: [object, "null"], properties: { codigo: { type: [string, "null"] }, mensagem: { type: string } } }
        verificacao_diaria:
          type: object
          description: "Verificação automática diária das notas emitidas pela notem com cancelamento pendente"
          properties:
            ultima_execucao: { type: [string, "null"], format: date-time }
            notas_verificadas: { type: integer }
            notas_atualizadas: { type: integer }
    NotaRecebida:
      type: object
      properties:
        id: { type: string, format: uuid }
        empresa_id: { type: string, format: uuid }
        origem: { type: string, enum: [notem, externa] }
        papel: { type: string, enum: [tomador, intermediario] }
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        situacao: { type: string, enum: [autorizada, cancelamento_em_analise, cancelada, substituida, cancelada_prefeitura] }
        restricoes: { type: array, items: { type: object } }
        manifestacao: { type: [object, "null"] }
        numero: { type: [string, "null"] }
        chave_acesso: { type: string, pattern: "^[0-9]{9}[0-9A-Z]{14}[0-9]{27}$", description: "50 posições; as 14 do CNPJ do emitente podem conter letras" }
        serie_dps: { type: [string, "null"] }
        numero_dps: { type: [string, "null"] }
        competencia: { type: [string, "null"], format: date }
        emitida_em: { type: [string, "null"], format: date-time }
        autorizada_em: { type: [string, "null"], format: date-time }
        prestador: { type: object, properties: { cnpj: { type: [string, "null"] }, nome: { type: [string, "null"] } } }
        intermediario: { type: [object, "null"], properties: { documento: { type: string }, nome: { type: [string, "null"] } } }
        tomador: { type: object }
        servico: { type: object }
        valores: { type: object }
        ibs_cbs: { oneOf: [{ $ref: "#/components/schemas/IbsCbs" }, { type: "null" }] }
        cancelamento: { type: [object, "null"] }
        links: { type: object, properties: { xml: { type: string, format: uri }, pdf: { type: string, format: uri }, consulta_publica: { type: [string, "null"] } } }
        criada_em: { type: string, format: date-time }
        atualizada_em: { type: string, format: date-time }
    PedidoCancelamento:
      type: object
      additionalProperties: false
      required: [motivo, justificativa]
      properties:
        motivo: { type: string, enum: [erro_emissao, servico_nao_prestado, outros] }
        justificativa: { type: string, description: "15 a 255 caracteres após a normalização de texto (convencoes.md)" }
    PedidoSubstituicao:
      type: object
      required: [motivo, justificativa]
      description: "Campos de NotaEntrada são opcionais; os não enviados vêm da nota original. empresa_id, se enviado, deve ser o da original."
      properties:
        motivo: { type: string, enum: [desenquadramento_simples, enquadramento_simples, inclusao_imunidade_isencao, exclusao_imunidade_isencao, rejeicao_tomador_intermediario, outros] }
        justificativa: { type: string, description: "15 a 255 caracteres após a normalização de texto" }
        id_externo: { type: [string, "null"], maxLength: 100 }
        servico_id: { type: string, format: uuid }
        servico_id_externo: { type: string, maxLength: 100 }
        competencia: { type: string, format: date }
        descricao: { type: string, maxLength: 2000 }
        tomador: { oneOf: [{ $ref: "#/components/schemas/Tomador" }, { type: "null" }] }
        tomador_id: { type: string, format: uuid }
        tomador_id_externo: { type: string, maxLength: 100 }
        valores: { type: object }
        retencao_iss: { type: [string, "null"], enum: [nao_retido, retido_tomador, retido_intermediario, null] }
        aliquota_iss_simples: { oneOf: [{ $ref: "#/components/schemas/Percentual" }, { type: "null" }] }
        local_prestacao: { type: [object, "null"], properties: { codigo_municipio: { $ref: "#/components/schemas/CodigoMunicipio" } } }
        informacoes_complementares: { type: [string, "null"], maxLength: 2000 }
    Tomador:
      type: object
      required: [tipo, nome]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        id_externo: { type: [string, "null"], maxLength: 100, description: "Único por empresa" }
        tipo: { type: string, enum: [pj, pf, estrangeiro] }
        nome: { type: string, minLength: 1, maxLength: 150 }
        documento: { type: [string, "null"], maxLength: 18, description: "CPF (11 números) ou CNPJ (14 posições, numérico ou alfanumérico) com dígitos verificadores válidos; máscara e minúsculas são normalizadas" }
        nif: { type: [string, "null"], maxLength: 40 }
        motivo_sem_nif: { type: [string, "null"], enum: [dispensado, nao_exigido, null] }
        email: { type: [string, "null"] }
        telefone: { type: [string, "null"] }
        inscricao_municipal: { type: [string, "null"], maxLength: 15 }
        endereco:
          type: [object, "null"]
          description: "Nacional exige CEP/logradouro/número/bairro/IBGE. Exterior exige país/cidade/código postal/província/logradouro ou endereço livre/número/bairro. Complemento opcional."
          properties:
            cep: { type: string, pattern: '^[0-9]{8}$' }
            codigo_municipio: { type: string, pattern: '^[0-9]{7}$' }
            pais: { type: string, pattern: '^[A-Z]{2}$' }
            cidade: { type: string }
            codigo_postal: { type: string }
            estado_provincia_regiao: { type: string }
            logradouro: { type: string }
            endereco_livre: { type: string }
            numero: { type: string }
            bairro: { type: string }
            complemento: { type: [string, "null"] }
        criada_em: { type: string, format: date-time, readOnly: true }
        atualizada_em: { type: string, format: date-time, readOnly: true }
    TomadorAlteracao:
      type: object
      description: "Campos opcionais de Tomador; resultado após mesclar com o cadastro deve ser válido."
      additionalProperties: true
    Ambiente:
      type: string
      enum: [homologacao, producao]
    Valor:
      type: string
      pattern: '^\d+\.\d{2}$'
      description: "Valor em reais, ponto decimal, 2 casas"
      examples: ["150.00"]
    Percentual:
      type: string
      pattern: '^\d{1,3}(\.\d{1,2})?$'
      examples: ["2.00"]
    Cnpj:
      type: string
      description: "CNPJ de 14 posições, numérico ou alfanumérico (12 posições 0-9/A-Z + 2 dígitos verificadores). Na entrada, máscara e minúsculas são aceitas e normalizadas; nas respostas vem sempre com 14 caracteres maiúsculos, sem máscara."
      maxLength: 18
      examples: ["11222333000181", "12ABC34501DE35"]
    CodigoMunicipio:
      type: string
      pattern: '^\d{7}$'
    Erro:
      type: object
      required: [erro, id_requisicao]
      properties:
        erro:
          type: object
          required: [codigo, mensagem, detalhes, codigo_governo, mensagem_governo]
          properties:
            codigo: { type: string, examples: ["REQUISICAO_INVALIDA"] }
            mensagem: { type: string }
            detalhes:
              type: array
              items:
                type: object
                properties:
                  campo: { type: string }
                  mensagem: { type: string }
                  codigo_governo: { type: [string, "null"] }
                  mensagem_governo: { type: [string, "null"] }
                  complemento: { type: [string, "null"] }
                  nota_id: { type: [string, "null"], format: uuid }
            codigo_governo: { type: [string, "null"] }
            mensagem_governo: { type: [string, "null"] }
        id_requisicao: { type: string }
    ListaPaginada:
      type: object
      required: [dados, proximo_cursor]
      properties:
        dados: { type: array, items: {} }
        proximo_cursor: { type: [string, "null"] }
    Endereco:
      type: object
      required: [cep, logradouro, numero, bairro, codigo_municipio]
      properties:
        cep: { type: string, pattern: '^\d{8}$' }
        logradouro: { type: string }
        numero: { type: string }
        complemento: { type: [string, "null"] }
        bairro: { type: string }
        codigo_municipio: { $ref: "#/components/schemas/CodigoMunicipio" }
        municipio: { type: [string, "null"], readOnly: true }
        uf: { type: string, readOnly: true }
    EmpresaEntrada:
      type: object
      required: [cnpj, razao_social, endereco]
      additionalProperties: false
      properties:
        id_externo: { type: [string, "null"], maxLength: 100, description: "Único por organização" }
        cnpj: { $ref: "#/components/schemas/Cnpj" }
        razao_social: { type: string }
        nome_fantasia: { type: string }
        inscricao_municipal: { type: string }
        email: { type: string }
        telefone: { type: string, pattern: '^\d{0,15}$' }
        ativa: { type: boolean, default: true }
        endereco: { $ref: "#/components/schemas/Endereco" }
    EmpresaAlteracao:
      description: "Mesmos campos de EmpresaEntrada, todos opcionais (endereco aceita campos parciais)"
      allOf: [{ $ref: "#/components/schemas/EmpresaEntrada" }]
    Empresa:
      description: "Na resposta, campos de texto não preenchidos (nome_fantasia, inscricao_municipal, email, telefone, endereco.complemento etc.) saem como null, nunca como texto vazio."
      allOf:
        - { $ref: "#/components/schemas/EmpresaEntrada" }
        - type: object
          properties:
            id: { type: string, format: uuid }
            criada_em: { type: string, format: date-time }
            atualizada_em: { type: string, format: date-time }
    ConfiguracaoFiscal:
      description: |
        Matriz obrigatória: nao_optante aceita somente percentual_por_esfera (E0713);
        mei aceita percentual_por_esfera ou nao_informar, nunca percentual_simples (E0710);
        me_epp aceita percentual_simples ou percentual_por_esfera, nunca nao_informar (E0712).
        Por esfera exige federal/estadual/municipal; zero é permitido. Ausentes são null.
        Legados incompatíveis não são reescritos, ficam com configuração fiscal incompleta
        e bloqueiam emissão antes de numerar com mensagem da regra.
        Regime especial deve ser nenhum para MEI (E0174), ME/EPP dentro do Simples (E0175)
        e serviços ativos com imunidade/exportação/não incidência (E0172).
      type: object
      required: [simples_nacional, regime_especial, tributos_aproximados]
      properties:
        simples_nacional: { type: string, enum: [nao_optante, mei, me_epp] }
        regime_apuracao_simples: { type: [string, "null"], enum: [dentro_do_simples, iss_fora_do_simples, tudo_fora_do_simples, null] }
        regime_especial: { type: string, enum: [nenhum, ato_cooperado, estimativa, microempresa_municipal, notario_registrador, profissional_autonomo, sociedade_profissionais, outros] }
        tributos_aproximados:
          type: object
          required: [modo]
          properties:
            modo: { type: string, enum: [percentual_simples, percentual_por_esfera, nao_informar] }
            percentual_simples: { oneOf: [{ $ref: "#/components/schemas/Percentual" }, { type: "null" }] }
            federal: { oneOf: [{ $ref: "#/components/schemas/Percentual" }, { type: "null" }] }
            estadual: { oneOf: [{ $ref: "#/components/schemas/Percentual" }, { type: "null" }] }
            municipal: { oneOf: [{ $ref: "#/components/schemas/Percentual" }, { type: "null" }] }
        aliquota_iss_simples: { oneOf: [{ $ref: "#/components/schemas/Percentual" }, { type: "null" }] }
        regime_apuracao_ibscbs: { type: [string, "null"], enum: [pelo_simples, cbs_simples_ibs_regular, regime_regular, null], description: "Somente ME/EPP (regApIBSCBSSN). Com ISS dentro do Simples: pelo_simples (padrão) ou regime_regular. Com ISS fora do Simples: cbs_simples_ibs_regular (padrão) ou regime_regular. Ausente ou null usa o padrão; ao mudar regime_apuracao_simples o padrão é reaplicado. Guardado agora e enviado a partir do próximo leiaute da NT 009." }
        imprimir_canhoto_danfse: { type: boolean, default: false, description: "Ausente no PUT preserva valor atual" }
        serie_dps: { type: [string, "null"], readOnly: true, examples: ["00900"] }
    Certificado:
      type: object
      properties:
        titular: { type: string }
        cnpj: { $ref: "#/components/schemas/Cnpj" }
        emissor: { type: string }
        numero_serie: { type: string }
        valido_de: { type: string, format: date-time }
        valido_ate: { type: string, format: date-time }
        situacao: { type: string, enum: [valido, vencendo, vencido] }
        dias_para_vencer: { type: integer }
    Servico:
      type: object
      required: [nome, codigo_servico, tributacao_iss, retencao_iss]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        id_externo: { type: [string, "null"], maxLength: 100 }
        nome: { type: string }
        ativo: { type: boolean, default: true }
        codigo_servico: { type: string, pattern: '^\d{6}$' }
        descricao_servico: { type: [string, "null"], readOnly: true }
        codigo_municipal: { type: [string, "null"] }
        codigo_nbs: { type: [string, "null"], pattern: '^\d{9}$' }
        descricao_padrao: { type: string }
        tributacao_iss: { type: string, enum: [tributavel, imunidade, exportacao, nao_incidencia] }
        tipo_imunidade: { type: [string, "null"], enum: [nao_informado, entes_federativos, templos, partidos_sindicatos_entidades, livros_jornais_papel, fonogramas_musicais, null] }
        retencao_iss: { type: string, enum: [nao_retido, retido_tomador, retido_intermediario] }
        classificacao_ibscbs: { oneOf: [{ $ref: "#/components/schemas/ClassificacaoIbsCbs" }, { type: "null" }] }
        indicador_operacao_ibscbs: { type: [string, "null"], deprecated: true, description: "Obsoleto: use classificacao_ibscbs.indicador_operacao. Ainda aceito; se enviado junto com um valor diferente em classificacao_ibscbs, responde 422." }
        numero_beneficio_municipal: { type: [string, "null"] }
    Situacao:
      description: "Configurações fiscais legadas incompatíveis com E0710/E0712/E0713 ou E0172/E0174/E0175 deixam configuracao_fiscal pendente, com mensagem da regra; não são reescritas."
      type: object
      properties:
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        pronta_para_emitir: { type: boolean }
        itens:
          type: array
          items:
            type: object
            properties:
              item: { type: string, enum: [empresa_ativa, certificado, configuracao_fiscal, servico_ativo, classificacao_ibscbs, municipio] }
              ok: { type: [boolean, "null"] }
              mensagem: { type: string }
              verificado_em: { type: [string, "null"], format: date-time }
        avisos:
          type: array
          description: "Alertas que não impedem a emissão. Antes da data de obrigatoriedade do IBS/CBS do ambiente (padrão 01/01/2027), serviços ativos sem classificação geram aviso; a partir dela viram o item classificacao_ibscbs."
          items: { type: object, properties: { item: { type: string, enum: [classificacao_ibscbs, atividade_simples] }, mensagem: { type: string } } }
    ClassificacaoIbsCbs:
      type: object
      required: [codigo_classificacao]
      description: "A notem envia só a classificação; alíquotas, base e valores do IBS/CBS são calculados pelo governo. O indicador é obrigatório quando a classificação exige tributação (E0860) e proibido quando não exige (E0859). Quando o indicador aponta para o endereço do tomador/destinatário, a nota exige tomador com CPF/CNPJ e endereço no Brasil (E0239/E0243), e o município do tomador deve ser o mesmo do cadastro na Receita Federal."
      properties:
        codigo_classificacao: { type: string, pattern: '^\d{6}$' }
        cst: { type: [string, "null"], readOnly: true }
        descricao: { type: [string, "null"], readOnly: true }
        indicador_operacao: { type: [string, "null"], pattern: '^\d{6}$' }
        consumidor_final: { type: boolean, default: false }
        atividade_simples: { type: [string, "null"], enum: ["07", "08", "09", "10", "11", "12", "13", "14", "90", null], description: "Somente ME/EPP. 10 só com 16.01; 11 só com 99.04.01; 12/13 só com 7.02 e 7.05. Enviada a partir do próximo leiaute." }
        situacao: { type: string, enum: [completa, pendente, a_revisar], readOnly: true, description: "a_revisar = indicador retirado da tabela oficial" }
    IbsCbs:
      type: object
      description: "Somente leitura: valores calculados pelo governo, lidos da NFS-e autorizada. null quando a nota não tem o grupo IBS/CBS."
      properties:
        classificacao: { type: object, properties: { cst: { type: [string, "null"] }, codigo: { type: [string, "null"] } } }
        indicador_operacao: { type: [string, "null"] }
        consumidor_final: { type: boolean }
        localidade_incidencia: { type: object, properties: { codigo_municipio: { type: [string, "null"] }, nome: { type: [string, "null"] } } }
        percentual_redutor: { type: [string, "null"] }
        base_calculo: { type: [string, "null"] }
        ajuste_base_calculo: { type: [string, "null"] }
        ajuste_base_locacao_imoveis: { type: [string, "null"] }
        ibs_uf: { $ref: "#/components/schemas/TributoIbsCbs" }
        ibs_municipal: { $ref: "#/components/schemas/TributoIbsCbs" }
        cbs: { $ref: "#/components/schemas/TributoIbsCbs" }
        valor_total_ibs: { type: [string, "null"] }
        valor_total_ibs_cbs: { type: [string, "null"], description: "vIBSTot + vCBS" }
        valor_total_nota: { type: [string, "null"], description: "vTotNF (valor líquido + IBS/CBS)" }
        credito_presumido_ibs: { type: [object, "null"], properties: { percentual: { type: [string, "null"] }, valor: { type: [string, "null"] } } }
        credito_presumido_cbs: { type: [object, "null"], properties: { percentual: { type: [string, "null"] }, valor: { type: [string, "null"] } } }
        receita_bruta_simples: { type: [string, "null"] }
        versao_calculadora: { type: [string, "null"] }
    TributoIbsCbs:
      type: object
      properties:
        aliquota: { type: [string, "null"] }
        reducao_aliquota: { type: [string, "null"] }
        aliquota_efetiva: { type: [string, "null"] }
        valor: { type: [string, "null"] }
        diferimento: { type: [string, "null"] }
    ValorSugerido:
      type: [object, "null"]
      properties:
        codigo: { type: string }
        descricao: { type: [string, "null"] }
        aplicavel: { type: boolean }
        motivo: { type: [string, "null"] }
    SugestaoIbsCbs:
      type: object
      properties:
        codigo_servico: { type: string }
        item: { type: string }
        nbs: { $ref: "#/components/schemas/ValorSugerido" }
        classificacao: { $ref: "#/components/schemas/ValorSugerido" }
        indicador_operacao: { $ref: "#/components/schemas/ValorSugerido" }
        atividade_simples: { $ref: "#/components/schemas/ValorSugerido" }
        alternativas: { type: object, properties: { nbs: { type: array, items: { type: string } }, classificacoes: { type: array, items: { type: string } }, indicadores_operacao: { type: array, items: { type: string } } } }
        aviso: { type: [string, "null"] }
  responses:
    LimiteExcedido:
      description: "LIMITE_EXCEDIDO — limite de uso atingido; aguarde os segundos indicados em Retry-After"
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Retry-After: { description: "Segundos até poder tentar de novo", schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    Erro:
      description: "Erro no formato padrão (ver convencoes.md)"
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    AutenticacaoInvalida:
      description: "Chave ausente, inválida ou revogada"
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }

# Webhooks são callbacks de saída; não são novos endpoints da API v1.
webhooks:
  eventoNotem:
    post:
      summary: Evento assinado da notem (inclui webhook.teste)
      description: |
        Contrato completo em webhooks.md. URL cadastrada no painel por ambiente.
        Corpo bruto preservado em todas as tentativas, sem garantia de ordem.
        HMAC SHA-256 de "{timestamp}.{corpoBruto}"; tolerância do receptor de 5 minutos.
        Oito tentativas: inicial, depois 1 min, 5 min, 30 min, 2 h, 6 h, 12 h e 24 h.
        Segredo anterior aceito por 24 h durante troca; múltiplos v1 no mesmo cabeçalho.
        Retenção 90 dias; três dias contínuos sem sucesso desativam o endereço e geram alerta.
        Filtro opcional por empresa da organização (vazio = todas); webhook.teste é sempre entregue.
        Envio de teste: tentativa direta de até 10 s com resultado no painel; falhas seguem o cronograma.
        Validação: assinatura (recomendada), chave de autorização opcional, ou confirmação do estado pela API.
      security: []
      parameters:
        - in: header
          name: Notem-Evento
          required: true
          schema: { type: string }
        - in: header
          name: Notem-Evento-Id
          required: true
          schema: { type: string, pattern: '^evt_[a-f0-9]{32}$' }
        - in: header
          name: Notem-Entrega-Id
          required: true
          schema: { type: string, pattern: '^whd_[a-f0-9]{32}$' }
        - in: header
          name: Notem-Assinatura
          required: true
          schema: { type: string }
          description: 't=timestamp,v1=HMAC; pode incluir duas assinaturas v1 na troca de segredo.'
        - in: header
          name: Authorization
          required: false
          schema: { type: string }
          description: |
            Somente quando o parceiro cadastrou uma chave de autorização. O nome do cabeçalho é escolhido no cadastro
            (padrão Authorization; nomes Notem-* e cabeçalhos de protocolo não são aceitos) e o valor é exatamente o cadastrado.
            A assinatura continua sempre enviada e é a validação recomendada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, tipo, criado_em, ambiente, organizacao_id, integracao_id, dados]
              properties:
                id: { type: string, pattern: '^evt_[a-f0-9]{32}$' }
                tipo:
                  type: string
                  enum: [webhook.teste, nota.autorizada, nota.rejeitada, nota.cancelada, nota.cancelamento_em_analise, nota.cancelamento_indeferido, nota.substituida, nota.cancelada_prefeitura, nota.bloqueada_prefeitura, nota.manifestacao, empresa.situacao_alterada, certificado.vencendo, certificado.vencido, municipio.disponivel]
                criado_em: { type: string, format: date-time }
                ambiente: { type: string, enum: [homologacao, producao] }
                organizacao_id: { type: string, format: uuid }
                integracao_id: { type: string, format: uuid }
                dados: { type: object }
            example:
              id: evt_00000000000000000000000000000000
              tipo: webhook.teste
              criado_em: '2026-11-05T00:00:00Z'
              ambiente: homologacao
              organizacao_id: '00000000-0000-4000-8000-000000000001'
              integracao_id: '00000000-0000-4000-8000-000000000002'
              dados: {}
      responses:
        '200':
          description: 'Qualquer 2xx recebido em até 10 segundos confirma a entrega.'
