    ConfiguracaoFiscal:
      description: |
        A forma de informar os tributos aproximados depende da situação no Simples Nacional, porque o governo recusa a nota quando elas não combinam.
        Empresa fora do Simples (nao_optante) usa só percentual_por_esfera.
        MEI usa percentual_por_esfera ou nao_informar, nunca percentual_simples.
        ME/EPP usa percentual_simples ou percentual_por_esfera, nunca nao_informar.
        Por esfera exige os três percentuais (federal, estadual e municipal); zero é permitido. Campos ausentes valem null.
        O regime especial deve ser nenhum para MEI, para ME/EPP com apuração dentro do Simples e para empresas com serviço ativo imune, de exportação ou sem incidência do ISS.
        Configurações antigas que não seguem essas regras não são alteradas automaticamente: ficam incompletas e a emissão é recusada, com a regra a corrigir, antes de gerar o número da nota.
        PIS/COFINS é opcional por empresa: só cst "99" com tipo_retencao "0" é suportado. Reenvie SEMPRE pis_cofins em cada PUT para manter a escolha; ausência ou null remove a configuração. Notas existentes preservam a escolha usada na criação.
      type: object
      required:
        - simples_nacional
        - regime_especial
        - tributos_aproximados
      properties:
        simples_nacional:
          description: "Correspondência na DPS (opSimpNac): nao_optante = 1; mei = 2; me_epp = 3."
          type: string
          enum:
            - nao_optante
            - mei
            - me_epp
        regime_apuracao_simples:
          description: "Somente ME/EPP. Correspondência na DPS (regApTribSN): dentro_do_simples = 1 (federais e ISS pelo Simples); iss_fora_do_simples = 2 (federais pelo Simples e ISS por fora); tudo_fora_do_simples = 3 (federais e ISS por fora)."
          type:
            - string
            - "null"
          enum:
            - dentro_do_simples
            - iss_fora_do_simples
            - tudo_fora_do_simples
            - null
        regime_especial:
          description: "Regime especial da empresa; nenhum corresponde a regEspTrib = 0 na DPS."
          type: string
          enum:
            - nenhum
            - ato_cooperado
            - estimativa
            - microempresa_municipal
            - notario_registrador
            - profissional_autonomo
            - sociedade_profissionais
            - outros
        pis_cofins:
          description: "Opcional por empresa, definido com seu contador. Reenvie SEMPRE em cada PUT para manter: ausência ou null remove a configuração. Somente cst 99 e tipo_retencao 0; outras combinações são recusadas com 422 REGRA_DE_NEGOCIO. Sem configuração, a DPS omite tribFed."
          oneOf:
            - $ref: "#/components/schemas/PisCofins"
            - type: "null"
        tributos_aproximados:
          type: object
          required:
            - modo
          properties:
            modo:
              type: string
              enum:
                - percentual_simples
                - percentual_por_esfera
                - nao_informar
            percentual_simples:
              oneOf:
                - $ref: "#/components/schemas/Percentual"
                - type: "null"
            federal:
              oneOf:
                - $ref: "#/components/schemas/Percentual"
                - type: "null"
            estadual:
              oneOf:
                - $ref: "#/components/schemas/Percentual"
                - type: "null"
            municipal:
              oneOf:
                - $ref: "#/components/schemas/Percentual"
                - type: "null"
        aliquota_iss_simples:
          oneOf:
            - $ref: "#/components/schemas/Percentual"
            - type: "null"
        regime_apuracao_ibscbs:
          type:
            - string
            - "null"
          enum:
            - pelo_simples
            - cbs_simples_ibs_regular
            - regime_regular
            - null
          description: >-
            Somente ME/EPP (regApIBSCBSSN). Com ISS dentro do Simples: pelo_simples (padrão) ou regime_regular. Com ISS fora do Simples: cbs_simples_ibs_regular
            (padrão) ou regime_regular. Ausente ou null usa o padrão; ao mudar regime_apuracao_simples o padrão é reaplicado. Guardado agora e enviado a partir
            do próximo leiaute da NT 009.
        imprimir_canhoto_danfse:
          type: boolean
          default: false
          description: Ausente no PUT preserva valor atual
        serie_dps:
          type:
            - string
            - "null"
          readOnly: true
          examples:
            - "00900"
