              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroValidacao:
                  $ref: "#/components/examples/ErroValidacao"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
