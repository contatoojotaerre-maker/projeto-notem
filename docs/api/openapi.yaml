webhooks:
  eventoNotem:
    post:
      summary: Evento assinado da notem (inclui webhook.teste)
      description: >
        Webhooks são avisos de saída da notem, não rotas da API v1. Contrato completo em https://docs.notemfiscal.com.br/webhooks/visao-geral. URL cadastrada no
        painel por ambiente.

        Corpo bruto preservado em todas as tentativas, sem garantia de ordem.

        HMAC SHA-256 de "{timestamp}.{corpoBruto}"; tolerância do receptor de 5 minutos.

        Oito tentativas: inicial, depois 1 min, 5 min, 30 min, 2 h, 6 h, 12 h e 24 h.

        Segredo anterior aceito por 24 h durante troca; múltiplos v1 no mesmo cabeçalho.

        Retenção 90 dias; três dias contínuos sem sucesso desativam o endereço e geram alerta.

        Filtro opcional por empresa da organização (vazio = todas); webhook.teste é sempre entregue.

        Envio de teste: tentativa direta de até 10 s com resultado no painel; falhas seguem o cronograma.

        Validação: assinatura (recomendada), chave de autorização opcional, ou confirmação do estado pela API.
      security: []
      parameters:
        - in: header
          name: Notem-Evento
          required: true
          schema:
            type: string
        - in: header
          name: Notem-Evento-Id
          required: true
          schema:
            type: string
            pattern: ^evt_[a-f0-9]{32}$
        - in: header
          name: Notem-Entrega-Id
          required: true
          schema:
            type: string
            pattern: ^whd_[a-f0-9]{32}$
        - in: header
          name: Notem-Assinatura
          required: true
          schema:
            type: string
          description: t=timestamp,v1=HMAC; pode incluir duas assinaturas v1 na troca de segredo.
        - in: header
          name: Authorization
          required: false
          schema:
            type: string
          description: |
            Somente quando o parceiro cadastrou uma chave de autorização. O nome do cabeçalho é escolhido no cadastro
            (padrão Authorization; nomes Notem-* e cabeçalhos de protocolo não são aceitos) e o valor é exatamente o cadastrado.
            A assinatura continua sempre enviada e é a validação recomendada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
                - tipo
                - criado_em
                - ambiente
                - organizacao_id
                - integracao_id
                - dados
              properties:
                id:
                  type: string
                  pattern: ^evt_[a-f0-9]{32}$
                tipo:
                  type: string
                  enum:
                    - webhook.teste
                    - nota.autorizada
                    - nota.rejeitada
                    - nota.cancelada
                    - nota.cancelamento_em_analise
                    - nota.cancelamento_indeferido
                    - nota.substituida
                    - nota.cancelada_prefeitura
                    - nota.bloqueada_prefeitura
                    - nota.desbloqueada_prefeitura
                    - nota.manifestacao
                    - empresa.situacao_alterada
                    - certificado.vencendo
                    - certificado.vencido
                    - municipio.disponivel
                criado_em:
                  type: string
                  format: date-time
                ambiente:
                  type: string
                  enum:
                    - homologacao
                    - producao
                organizacao_id:
                  type: string
                  format: uuid
                integracao_id:
                  type: string
                  format: uuid
                dados:
                  type: object
            example:
              id: evt_00000000000000000000000000000000
              tipo: webhook.teste
              criado_em: "2026-11-05T00:00:00Z"
              ambiente: homologacao
              organizacao_id: 00000000-0000-4000-8000-000000000001
              integracao_id: 00000000-0000-4000-8000-000000000002
              dados: {}
      responses:
        "200":
          description: Qualquer 2xx recebido em até 10 segundos confirma a entrega.
