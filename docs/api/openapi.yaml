      operationId: consultarConfiguracaoFiscal
      x-titulo: Consultar configuração fiscal
      summary: "Devolve como a empresa é tributada: Simples Nacional, regimes e tributos aproximados."
      description: |-
        Use para conferir como os tributos da empresa serão informados nas notas. A resposta também traz a série usada na numeração das notas (`serie_dps`), que a notem atribui automaticamente.
        `pis_cofins` traz a escolha da empresa para PIS/COFINS (somente CST 99 e retenção 0 nesta versão), ou null quando não configurado.
      responses:
        "200":
          description: Configuração
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguracaoFiscal"
              examples:
