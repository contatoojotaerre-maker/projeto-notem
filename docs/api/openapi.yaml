openapi: 3.1.0
info:
  title: API da notem
  version: 1.0.0
  description: >
    API para emissão e gestão de NFS-e (padrão nacional) por sistemas parceiros.

    Documentação: https://docs.notemfiscal.com.br. Campos em português; valores monetários como texto ("150.00").

    Toda rota tem limites de uso por chave e ambiente (https://docs.notemfiscal.com.br/primeiros-passos/limites): ao exceder, responde 429 LIMITE_EXCEDIDO com
    Retry-After.

    Corpo acima de 200 KB responde 413.

    Todos os exemplos usam dados fictícios.
  x-atualizado: "2026-11-17"
servers:
  - url: https://app.notemfiscal.com.br/api/v1
    description: API oficial da notem
security:
  - chaveIntegracao: []
tags:
  - name: Status
    description: Verificação da chave e do ambiente
  - name: Empresas
    description: Cadastro das empresas emitentes (compartilhadas entre ambientes)
  - name: Configuração fiscal
    description: Simples Nacional, regimes e tributos aproximados da empresa
  - name: Certificado
    description: Certificado digital A1 da empresa
  - name: Serviços
    description: Modelos de serviço da empresa, com código nacional e classificação IBS/CBS
  - name: Tomadores
    description: Clientes cadastrados de cada empresa
  - name: Situação da empresa
    description: Se a empresa está pronta para emitir e se o município atende o ambiente
  - name: Sincronização
    description: Situação da sincronização com o Ambiente de Dados Nacional
  - name: Notas
    description: Emissão, consulta, cancelamento e substituição de NFS-e
  - name: Notas recebidas
    description: Notas em que a empresa é tomadora ou intermediária
  - name: Catálogos
    description: Catálogos oficiais somente leitura
paths:
  /notas:
    get:
      tags:
        - Notas
      operationId: listarNotas
      x-titulo: Listar notas
      summary: "Lista as notas da organização no ambiente da chave, da mais recente para a mais antiga."
      description: |-
        Use para acompanhar as notas emitidas ou montar relatórios. A lista é paginada e aceita filtros por empresa, situação, tomador e período de emissão.

        Inclui também as notas que as empresas da organização emitiram fora da notem, por outro sistema ou pelo Portal Nacional. Elas aparecem depois da sincronização com o governo e vêm com `origem: externa`.
      parameters:
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Cursor"
        - name: empresa_id
          in: query
          schema:
            type: string
            format: uuid
        - name: empresa_id_externo
          in: query
          schema:
            type: string
        - name: situacao
          in: query
          schema:
            type: string
            enum:
              - processando
              - em_verificacao
              - autorizada
              - rejeitada
              - cancelamento_em_analise
              - cancelada
              - substituida
              - cancelada_prefeitura
        - name: id_externo
          in: query
          schema:
            type: string
        - name: tomador_documento
          in: query
          schema:
            type: string
        - name: emitida_de
          in: query
          schema:
            type: string
            format: date
        - name: emitida_ate
          in: query
          schema:
            type: string
            format: date
        - name: origem
          in: query
          description: notem = emitidas pela notem; externa = emitidas fora da notem por empresas da organização (trazidas pela sincronização)
          schema:
            type: string
            enum:
              - notem
              - externa
      responses:
        "200":
          description: Lista paginada de notas
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items:
                      $ref: "#/components/schemas/Nota"
                  proximo_cursor:
                    type:
                      - string
                      - "null"
              examples:
                listaNotas:
                  $ref: "#/components/examples/ListaNotas"
        "400":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroBusca:
                  $ref: "#/components/examples/ErroBusca"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
    post:
      tags:
        - Notas
      operationId: emitirNota
      x-titulo: Emitir nota
      summary: "Envia a NFS-e ao governo e devolve a nota autorizada ou o motivo da recusa."
      description: |-
        Use para emitir uma nota fiscal de serviço por uma empresa que já está pronta para emitir (veja [Consultar situação](https://docs.notemfiscal.com.br/referencia/situacao-da-empresa/consultar-situacao)). A notem monta a nota com o serviço e o tomador cadastrados ou informados no pedido, envia ao governo e espera a resposta por até cerca de 20 segundos.

        Antes de gerar o número da nota, a notem confere a empresa, o serviço, o tomador e os tributos. Se algo estiver errado, a resposta é 422 com o campo e o motivo, e nenhum número é usado. Por exemplo, o tomador não pode ter o mesmo CPF/CNPJ da empresa (E0202 — o CPF/CNPJ do tomador é igual ao da empresa emitente), e ISS retido pelo tomador exige CPF/CNPJ e endereço completo no Brasil (E0204 e E0237). Todas as recusas do governo, com o que fazer em cada uma, estão em [Rejeições do governo](https://docs.notemfiscal.com.br/referencia/rejeicoes-do-governo).

        O que esperar: 201 com a nota autorizada; 422 REJEITADO_GOVERNO quando o governo recusa, com o motivo original e uma explicação em português; 202 quando o governo não respondeu a tempo. No caso do 202, a nota fica em verificação, a notem descobre o resultado sozinha e avisa por webhook (`nota.autorizada` ou `nota.rejeitada`).

        O cabeçalho `Idempotency-Key` é obrigatório e evita nota duplicada. Se a conexão cair e você não souber se a nota foi emitida, consulte a nota antes de tentar de novo. Repetir com a mesma `Idempotency-Key` é seguro: devolve a mesma nota, sem emitir outra. Nunca use uma chave nova para repetir o mesmo pedido. A chave fica ligada a essa nota para sempre; usá-la com outro conteúdo responde 409.

        Se o único motivo da recusa for número já usado (E0014 — já existe uma nota da empresa com essa série e número), a notem tenta sozinha os números seguintes, até cinco vezes, e a nota mantém o mesmo ID.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotaEntrada"
            examples:
              notaEntrada:
                $ref: "#/components/examples/NotaEntrada"
      responses:
        "201":
          description: Nota autorizada (incluindo repetição)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaAutorizada:
                  $ref: "#/components/examples/NotaAutorizada"
        "202":
          description: Nota em processamento ou verificação automática
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaEmVerificacao:
                  $ref: "#/components/examples/NotaEmVerificacao"
        "400":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroIdempotencyKey:
                  $ref: "#/components/examples/ErroIdempotencyKey"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
        "404":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
        "409":
          description: IDEMPOTENCIA_CONFLITO, ID_EXTERNO_DUPLICADO ou configuração alterada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroIdempotencia:
                  $ref: "#/components/examples/ErroIdempotencia"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "422":
          description: REGRA_DE_NEGOCIO, EMPRESA_NAO_PRONTA ou REJEITADO_GOVERNO (detalhes incluem nota_id e mensagens originais)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroRejeitadoGoverno:
                  $ref: "#/components/examples/ErroRejeitadoGoverno"
                erroEmpresaNaoPronta:
                  $ref: "#/components/examples/ErroEmpresaNaoPronta"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "503":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroGoverno:
                  $ref: "#/components/examples/ErroGoverno"
  /notas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: "UUID (RFC 9562). Fora do padrão: 400 REQUISICAO_INVALIDA com campo igual ao nome do parâmetro."
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Notas
      operationId: consultarNota
      x-titulo: Consultar nota
      summary: "Devolve a nota completa, com situação, valores, tomador e links do XML e do PDF."
      description: |-
        Use para acompanhar uma nota depois da emissão, principalmente quando a emissão respondeu 202 ou quando a conexão caiu antes da resposta.

        A nota só é encontrada com uma chave da mesma organização e do mesmo ambiente em que foi emitida. Com outra chave, a resposta é 404.
      responses:
        "200":
          description: Nota completa
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaAutorizada:
                  $ref: "#/components/examples/NotaAutorizada"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
        "404":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
  /notas/{id}/xml:
    parameters:
      - name: id
        in: path
        required: true
        description: "UUID (RFC 9562). Fora do padrão: 400 REQUISICAO_INVALIDA com campo igual ao nome do parâmetro."
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Notas
      operationId: baixarXmlNota
      x-titulo: Baixar XML da nota
      summary: "Baixa o XML oficial da nota, exatamente como o governo devolveu."
      description: |-
        Use para guardar o documento fiscal ou entregá-lo ao seu cliente. A notem não altera o arquivo. O XML continua disponível depois de um cancelamento ou de uma substituição.

        Nota que nunca foi autorizada não tem XML e responde 404.
      responses:
        "200":
          description: XML sem alterações
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/xml:
              schema:
                type: string
              examples:
                xmlNota:
                  $ref: "#/components/examples/XmlNota"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
        "404":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
  /notas/{id}/cancelar:
    parameters:
      - name: id
        in: path
        required: true
        description: "UUID (RFC 9562). Fora do padrão: 400 REQUISICAO_INVALIDA com campo igual ao nome do parâmetro."
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Notas
      operationId: cancelarNota
      x-titulo: Cancelar nota
      summary: "Pede ao governo o cancelamento de uma nota autorizada e devolve a nota cancelada ou o motivo da recusa."
      description: |-
        Use quando a nota foi emitida por engano ou o serviço não foi prestado. Só é possível cancelar nota autorizada, emitida pela notem no ambiente da chave, e cada nota aceita um pedido por vez. Informe o motivo e uma justificativa de 15 a 255 caracteres.

        O que esperar: 200 com a nota cancelada; 422 REJEITADO_GOVERNO quando o governo recusa, com o motivo original e uma explicação em português; 202 quando o governo ainda não confirmou. No caso do 202, a nota continua autorizada, com `operacao_pendente` preenchido, até a notem descobrir o resultado e avisar por webhook.

        Alguns municípios não permitem cancelar diretamente, por exemplo depois do prazo ou acima de um valor. Nesses casos a recusa vem com `pode_solicitar_analise: true`, e você pode pedir que a prefeitura analise o cancelamento em [Solicitar análise do cancelamento](https://docs.notemfiscal.com.br/referencia/notas/solicitar-analise-cancelamento).

        O cabeçalho `Idempotency-Key` é obrigatório. Repetir o pedido com a mesma chave é seguro: devolve o mesmo resultado, sem enviar outro pedido ao governo.

        Se a nota já tiver sido cancelada por outro caminho, como o Portal Nacional, a notem encontra o cancelamento no governo, marca a nota como cancelada e responde 200. O histórico da nota mostra "Cancelamento registrado fora da notem".
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoCancelamento"
            examples:
              pedidoCancelamento:
                $ref: "#/components/examples/PedidoCancelamento"
      responses:
        "200":
          description: Cancelamento registrado; nota com situacao cancelada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaCancelada:
                  $ref: "#/components/examples/NotaCancelada"
        "202":
          description: Aguardando confirmação do governo; nota segue autorizada com operacao_pendente
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaCancelamentoPendente:
                  $ref: "#/components/examples/NotaCancelamentoPendente"
        "400":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroValidacao:
                  $ref: "#/components/examples/ErroValidacao"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
        "404":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
        "409":
          description: CONFLITO (nota não autorizada, pedido ou substituição em andamento) ou IDEMPOTENCIA_CONFLITO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroConflitoNota:
                  $ref: "#/components/examples/ErroConflitoNota"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "422":
          description: REGRA_DE_NEGOCIO (justificativa, certificado), EMPRESA_NAO_PRONTA ou REJEITADO_GOVERNO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroCancelamentoMunicipio:
                  $ref: "#/components/examples/ErroCancelamentoMunicipio"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "503":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroGoverno:
                  $ref: "#/components/examples/ErroGoverno"
  /notas/{id}/solicitar-analise-cancelamento:
    parameters:
      - name: id
        in: path
        required: true
        description: "UUID (RFC 9562). Fora do padrão: 400 REQUISICAO_INVALIDA com campo igual ao nome do parâmetro."
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Notas
      operationId: solicitarAnaliseCancelamento
      x-titulo: Solicitar análise do cancelamento
      summary: "Pede à prefeitura que analise um cancelamento que o município não permite fazer diretamente."
      description: |-
        Use depois que um cancelamento for recusado com `pode_solicitar_analise: true`, por exemplo porque o prazo de cancelamento do município acabou. O corpo, as regras e as respostas são os mesmos de [Cancelar nota](https://docs.notemfiscal.com.br/referencia/notas/cancelar-nota).

        Quando o pedido é registrado, a nota fica `cancelamento_em_analise` até a prefeitura decidir. A notem ainda não acompanha essa decisão automaticamente; até lá, a nota continua em análise.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoCancelamento"
            examples:
              pedidoAnalise:
                $ref: "#/components/examples/PedidoAnalise"
      responses:
        "200":
          description: Pedido registrado; nota com situacao cancelamento_em_analise
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaEmAnalise:
                  $ref: "#/components/examples/NotaEmAnalise"
        "202":
          description: Aguardando confirmação do governo
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nota"
              examples:
                notaCancelamentoPendente:
                  $ref: "#/components/examples/NotaCancelamentoPendente"
        "400":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroValidacao:
                  $ref: "#/components/examples/ErroValidacao"
        "401":
          description: Chave ausente, inválida ou revogada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroAutenticacao:
                  $ref: "#/components/examples/ErroAutenticacao"
        "404":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroNaoEncontrado:
                  $ref: "#/components/examples/ErroNaoEncontrado"
        "409":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroConflitoNota:
                  $ref: "#/components/examples/ErroConflitoNota"
        "422":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                erroEmpresaNaoPronta:
                  $ref: "#/components/examples/ErroEmpresaNaoPronta"
        "503":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
