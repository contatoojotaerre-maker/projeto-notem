          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguracaoFiscal"
              examples:
                configuracaoFiscal:
                  $ref: "#/components/examples/ConfiguracaoFiscal"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          description: '[Erro no formato padrão](https://docs.notemfiscal.com.br/primeiros-passos/erros)'
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
