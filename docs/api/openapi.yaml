                  $ref: "#/components/examples/ErroSugestao"
components:
  securitySchemes:
    chaveIntegracao:
      type: http
      scheme: bearer
      description: >-
        Chave da integração: ntm_homolog_... (homologação) ou ntm_prod_... (produção). Não expira; vale até ser revogada (efeito imediato). Até duas chaves
        ativas por integração e ambiente.
  headers:
    XRequestId:
      description: Identificador da requisição (informe ao suporte)
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Chave de idempotência (até 100 caracteres) aceita em POST, PATCH, PUT e DELETE; vale 24 h por integração e ambiente, exceto emissão, cancelamento,
        análise e substituição de notas (associação duradoura ao pedido). Mesmo conteúdo devolve a mesma resposta (cabeçalho Idempotent-Replayed true); conteúdo
        diferente devolve 409 IDEMPOTENCIA_CONFLITO. Obrigatória em emissão, cancelamento e substituição.
      schema:
        type: string
        maxLength: 100
    Limite:
      name: limite
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EmpresaId:
      name: id
      in: path
      required: true
      description: Empresa da organização da chave (de outra organização → 404). UUID (RFC 9562); fora do padrão → 400 REQUISICAO_INVALIDA com campo id.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  schemas:
    NotaEntrada:
      type: object
      additionalProperties: false
      required:
        - valores
      description: >-
        Textos são normalizados antes de validar e o texto normalizado é o enviado ao governo; caracteres sem equivalente retornam 422 (contém caracteres não
        aceitos pela NFS-e). Exatamente um seletor de empresa e um de serviço; no máximo um seletor de tomador. CPF/CNPJ/endereço nacional completos exigidos
        com retenção pelo tomador (E0204/E0237). E0202 e regras fiscais verificadas antes de numerar.
      properties:
        empresa_id:
          type: string
          format: uuid
        empresa_id_externo:
          type: string
          minLength: 1
          maxLength: 100
        id_externo:
          type:
            - string
            - "null"
          maxLength: 100
          description: Único por organização
        servico_id:
          type: string
          format: uuid
        servico_id_externo:
          type: string
          minLength: 1
          maxLength: 100
        competencia:
          type: string
          format: date
          description: Não pode ser futura; padrão data atual em Brasília
        descricao:
          type: string
          minLength: 1
          maxLength: 2000
        tomador:
          oneOf:
            - $ref: "#/components/schemas/Tomador"
            - type: "null"
        tomador_id:
          type: string
          format: uuid
        tomador_id_externo:
          type: string
          maxLength: 100
        valores:
          type: object
          additionalProperties: false
          required:
            - servico
          properties:
            servico:
              $ref: "#/components/schemas/Valor"
            desconto_incondicionado:
              $ref: "#/components/schemas/Valor"
              description: Zero omitido na DPS (E0431)
            desconto_condicionado:
              $ref: "#/components/schemas/Valor"
              description: Zero omitido na DPS (E0432)
        retencao_iss:
          type:
            - string
            - "null"
          enum:
            - nao_retido
            - retido_tomador
            - retido_intermediario
            - null
        aliquota_iss_simples:
          oneOf:
            - $ref: "#/components/schemas/Percentual"
            - type: "null"
        local_prestacao:
          type:
            - object
            - "null"
          properties:
            codigo_municipio:
              $ref: "#/components/schemas/CodigoMunicipio"
        informacoes_complementares:
          type:
            - string
            - "null"
          maxLength: 2000
    Nota:
      type: object
      properties:
        id:
          type: string
          format: uuid
        id_externo:
          type:
            - string
            - "null"
        origem:
          type: string
          enum:
            - notem
            - externa
          description: externa = emitida por outro sistema ou pelo Portal Nacional; somente leitura (cancelar, solicitar análise e substituir respondem 409 CONFLITO)
        empresa_id:
          type: string
          format: uuid
        ambiente:
          $ref: "#/components/schemas/Ambiente"
        situacao:
          type: string
          enum:
            - processando
            - em_verificacao
            - autorizada
            - rejeitada
            - cancelamento_em_analise
            - cancelada
            - substituida
            - cancelada_prefeitura
        restricoes:
          type: array
          items:
            type: string
        manifestacao:
          type:
            - object
            - "null"
        numero:
          type:
            - string
            - "null"
        chave_acesso:
          type:
            - string
            - "null"
          pattern: ^[0-9]{9}[0-9A-Z]{14}[0-9]{27}$
          description: 50 posições; as 14 do CNPJ do emitente podem conter letras
        serie_dps:
          type: string
        numero_dps:
          type: string
        competencia:
          type: string
          format: date
        emitida_em:
          type: string
          format: date-time
        autorizada_em:
          type:
            - string
            - "null"
          format: date-time
        tomador:
          oneOf:
            - $ref: "#/components/schemas/Tomador"
            - type: "null"
        servico:
          type: object
          properties:
            servico_id:
              type: string
              format: uuid
            codigo_servico:
              type: string
            descricao:
              type: string
        valores:
          type: object
          properties:
            servico:
              $ref: "#/components/schemas/Valor"
            desconto_incondicionado:
              $ref: "#/components/schemas/Valor"
            desconto_condicionado:
              $ref: "#/components/schemas/Valor"
            base_calculo:
              type:
                - string
                - "null"
            aliquota_iss:
              type:
                - string
                - "null"
            valor_iss:
              type:
                - string
                - "null"
            valor_liquido:
              type:
                - string
                - "null"
            iss_retido:
              type: boolean
        local_prestacao:
          type: object
        ibs_cbs:
          oneOf:
            - $ref: "#/components/schemas/IbsCbs"
            - type: "null"
        erros_governo:
          type: array
          items:
            type: object
        substitui_nota_id:
          type:
            - string
            - "null"
          format: uuid
        substituida_por_nota_id:
          type:
            - string
            - "null"
          format: uuid
        operacao_pendente:
          type:
            - object
            - "null"
          description: Pedido aguardando confirmação do governo; null quando não houver
          properties:
            tipo:
              type: string
              enum:
                - cancelamento
                - analise_cancelamento
            estado:
              type: string
              enum:
                - em_verificacao
            desde:
              type:
                - string
                - "null"
              format: date-time
        cancelamento:
          type:
            - object
            - "null"
          description: Último pedido de cancelamento ou análise fiscal; null quando nunca houve
          properties:
            tipo:
              type: string
              enum:
                - cancelamento
                - analise_cancelamento
            motivo:
              type: string
              enum:
                - erro_emissao
                - servico_nao_prestado
                - outros
            justificativa:
              type: string
            solicitado_em:
              type:
                - string
                - "null"
              format: date-time
            registrado_em:
              type:
                - string
                - "null"
              format: date-time
            situacao:
              type: string
              enum:
                - em_verificacao
                - cancelado
                - em_analise
                - recusado
                - nao_registrado
                - nao_enviado
            pode_solicitar_analise:
              type: boolean
            registrado_fora_da_notem:
              type: boolean
            erros_governo:
              type: array
              items:
                type: object
        links:
          type: object
          properties:
            xml:
              type: string
              format: uri
            pdf:
              type: string
              format: uri
            consulta_publica:
              type:
                - string
                - "null"
              description: https://www.nfse.gov.br/ConsultaPublica?tpc=1&chave={chave_acesso}; null somente sem chave válida
        criada_em:
          type: string
          format: date-time
        atualizada_em:
          type: string
          format: date-time
    Sincronizacao:
      type: object
      properties:
        ambiente:
          $ref: "#/components/schemas/Ambiente"
        situacao:
          type: string
          enum:
            - nunca_sincronizada
            - em_andamento
            - atualizada
            - erro
        ultimo_nsu:
          type:
            - integer
            - "null"
        ultima_consulta:
          type:
            - string
            - "null"
          format: date-time
        proxima_consulta_permitida:
          type:
            - string
            - "null"
          format: date-time
          description: null quando já é possível sincronizar
        primeira_sincronizacao_concluida_em:
          type:
            - string
            - "null"
          format: date-time
        documentos_importados:
          type: integer
        sincronizacao_em_andamento:
          type:
            - object
            - "null"
